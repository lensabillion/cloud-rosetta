terms:
  - term: Role
    severity: high
    aws:
      meaning: >-
        An assumable identity with its own temporary credentials issued by STS, and a trust
        policy naming who may assume it.
      category: identity
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
    azure:
      meaning: >-
        A named set of permissions, meaningless until assigned to a separate principal at a
        scope.
      category: permission set
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
    gcp:
      meaning: >-
        A named collection of permissions, bound to a member at a resource node.
      category: permission set
      url: https://docs.cloud.google.com/iam/docs/roles-overview
    why_it_hurts: >-
      An AWS role is a thing you become; the other two are lists of verbs pinned to somebody
      else. Different categories of object behind one word. The nearest AWS equivalent of an
      Azure or Google role is a managed policy, and the nearest Azure or Google equivalent of an
      AWS role is a service principal or service account.
    see_also: [Policy, Service account, Principal]
    verified: '2026-09-09'

  - term: Resource group
    severity: high
    aws:
      meaning: >-
        An optional, tag-driven query that produces a view over resources. It owns nothing.
      category: saved view
      url: https://docs.aws.amazon.com/ARG/latest/userguide/welcome.html
    azure:
      meaning: >-
        A lifecycle and management container for resources deployed at resource-group scope.
        Deletion requests removal of its contents; locks, dependencies and service behavior can
        block completion. Not every Azure resource type belongs to a resource group.
      category: ownership container
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/delete-resource-group
    why_it_hurts: >-
      Deleting an AWS Resource Group removes the grouping, not its members. Azure resource-group
      deletion requests deletion of member resources, subject to locks and dependencies. Google
      projects are a different lifecycle boundary.
    see_also: [Stack, Project]
    verified: '2026-09-14'

  - term: Policy
    severity: high
    aws:
      meaning: >-
        A JSON document listing actions, resources and conditions, attached to an identity or a
        resource.
      category: permissions document
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html
    azure:
      meaning: >-
        Azure Policy is a governance engine evaluating resource configuration at write time. It
        is not the permissions system.
      category: configuration governance engine
      url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
    gcp:
      meaning: >-
        An IAM allow policy binds roles to principals. IAM deny policies and organization
        policies are separate controls; their scope and supported operations differ.
      category: two different things
      url: https://docs.cloud.google.com/iam/docs/policies
    why_it_hurts: >-
      Specify the policy product and effect. An IAM permission grant, an IAM deny, and a
      resource-configuration constraint answer different questions. Governance controls do not
      substitute for application authorization.
    see_also: [Role, Service control policy]
    verified: '2026-09-14'

  - term: ASG
    severity: high
    aws:
      meaning: >-
        Auto Scaling group. A pool of EC2 instances that can scale together; mixed instance
        types and purchase options are supported.
      category: compute
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-groups.html
    azure:
      meaning: >-
        Application security group. A named group of network interfaces that NSG rules can
        reference instead of listing addresses.
      category: networking
      url: https://learn.microsoft.com/en-us/azure/virtual-network/application-security-groups
    why_it_hurts: >-
      One acronym, two services, different domains entirely, and both are common enough that the
      abbreviation gets used unqualified in study notes and team chat. Expand it every time.
    see_also: [Security group]
    verified: '2026-09-14'

  - term: Container
    severity: high
    aws:
      meaning: >-
        An OCI container image or running container. The storage equivalent is a bucket.
      category: compute packaging
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html
    azure:
      meaning: >-
        In Blob Storage, a grouping of blobs inside a storage account. Roughly what the other
        clouds call a bucket.
      category: storage grouping
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
    gcp:
      meaning: >-
        An OCI container image or running container. The storage equivalent is a bucket.
      category: compute packaging
      url: https://docs.cloud.google.com/run/docs/container-contract
    why_it_hurts: >-
      Azure uses the word for both meanings in the same portal. "Create a container" in a
      storage context means a blob grouping and has nothing to do with Docker, Kubernetes or
      Container Apps. Reading it as a compute object sends the whole answer wrong.
    see_also: [Bucket, Storage account]
    verified: '2026-09-09'

  - term: Availability set
    severity: high
    aws:
      meaning: >-
        AWS does not use the Azure availability-set resource. Placement groups and multi-zone
        deployment address different placement and failure requirements.
      category: no equivalent
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-groups.html
    azure:
      meaning: >-
        A grouping using fault domains and update domains inside a single datacentre, protecting
        against rack failure and host patching.
      category: intra-datacentre placement
      url: https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
    gcp:
      meaning: >-
        Google does not use the Azure availability-set resource. Placement policies and
        distribution across zones must be evaluated against the intended failure domain.
      category: no equivalent
      url: https://docs.cloud.google.com/compute/docs/instances/define-instance-placement
    why_it_hurts: >-
      An availability set is not a multi-zone deployment. Surviving loss of a zone requires
      replicas in other zones and a functioning failover path. Merely placing all resources in
      one availability zone does not provide that protection.
    see_also: [Availability zone, Fault domain]
    verified: '2026-09-14'

  - term: Endpoint
    severity: high
    aws:
      meaning: >-
        For VPC endpoints, gateway endpoints provide route-based S3 and DynamoDB access.
        Interface endpoints place endpoint interfaces in selected subnets for supported
        PrivateLink services. There are other endpoint types; identify the product and mode.
      category: private connectivity
      url: https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html
    azure:
      meaning: >-
        Two unrelated things. A service endpoint keeps traffic on the backbone while the service
        keeps its public IP. A private endpoint puts a private IP from your subnet in front of
        the service.
      category: private connectivity, two variants
      url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
    gcp:
      meaning: >-
        Private Service Connect endpoints, plus Private Google Access as a separate subnet
        setting.
      category: private connectivity
      url: https://docs.cloud.google.com/vpc/docs/private-service-connect
    why_it_hurts: >-
      For the Azure service-endpoint/private-endpoint pair, only the private endpoint supplies a
      private address in the consumer VNet. Hybrid clients also need working routing and DNS.
      Endpoint connectivity does not itself grant permission or disable a service public
      endpoint.
    see_also: [Private Link, Service endpoint]
    verified: '2026-09-14'

  - term: Project
    severity: medium
    aws:
      meaning: >-
        An AWS account is the relevant workload administration boundary here; individual AWS
        services can also have objects named projects.
      category: not applicable
      url: https://docs.aws.amazon.com/accounts/latest/reference/welcome.html
    azure:
      meaning: >-
        An Azure subscription is the relevant workload administration scope here; a project in
        another Azure product is not automatically that scope.
      category: not applicable
      url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/initial-subscriptions
    gcp:
      meaning: >-
        A container for workload resources and API configuration. Organization, folder and
        billing resources exist outside projects. A project has a mutable name, an immutable
        unique ID and an assigned number.
      category: isolation boundary
      url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-projects
    why_it_hurts: >-
      Project name, ID and number are different identifiers. The ID cannot be reused after
      deletion. Choose project boundaries for access, quotas and operations rather than assuming
      they map exactly to another provider account.
    see_also: [Account, Subscription]
    verified: '2026-09-14'

  - term: Account
    severity: medium
    aws:
      meaning: >-
        A resource and IAM administration boundary identified by a 12-digit number.
        Organizations supports consolidated billing; workforce identities can be federated
        across accounts.
      category: boundary
      url: https://docs.aws.amazon.com/accounts/latest/reference/welcome.html
    azure:
      meaning: >-
        Usually means a sign-in identity. A storage account is something else entirely, and a
        billing account something else again.
      category: overloaded
      url: https://learn.microsoft.com/en-us/azure/cost-management-billing/understand/view-all-accounts
    gcp:
      meaning: >-
        Usually a user identity. A billing account is a separate payable object linked to
        projects. A service account is a machine identity.
      category: overloaded
      url: https://docs.cloud.google.com/billing/docs/concepts
    why_it_hurts: >-
      An AWS account holds workload resources and IAM configuration. In Azure and Google,
      qualify whether account means a person, workload identity, billing object or storage
      object. Identity, resource and payment boundaries are related but not identical.
    see_also: [Project, Subscription, Service account]
    verified: '2026-09-14'

  - term: Security group
    severity: medium
    aws:
      meaning: >-
        A stateful allow-only filter attached to a network interface. It cannot deny.
      category: instance firewall
      url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
    azure:
      meaning: >-
        Network security group, a stateful filter with allow and deny rules evaluated by
        priority, attachable to a subnet, a NIC, or both.
      category: subnet or instance firewall
      url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
    gcp:
      meaning: >-
        No object by this name. VPC firewall rules do the job, attached to the network and
        targeted by tag or service account.
      category: network firewall
      url: https://docs.cloud.google.com/firewall/docs/firewalls
    why_it_hurts: >-
      The AWS object cannot deny anything, which people consistently forget, and Azure's
      similarly named object can. In Entra ID, "security group" additionally means a directory
      group of users, a third unrelated sense.
    see_also: [ASG, Network ACL, Firewall rule]
    verified: '2026-09-09'

  - term: Tag
    severity: medium
    aws:
      meaning: >-
        A key-value label for billing, search and access control conditions.
      category: metadata
      url: https://docs.aws.amazon.com/tag-editor/latest/userguide/tagging.html
    azure:
      meaning: >-
        A key-value label for billing and search, usable as a condition in Azure Policy.
      category: metadata
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources
    gcp:
      meaning: >-
        Three distinct constructs: labels for resource metadata, network tags for firewall and
        route selection, and Resource Manager tags for governed key-value associations and
        supported policy conditions.
      category: metadata and network selector
      url: https://docs.cloud.google.com/resource-manager/docs/tags/tags-overview
    why_it_hurts: >-
      A network tag is metadata with operational effects: firewall rules and routes can select
      it. A Resource Manager tag is a different governed construct. Do not treat either as
      interchangeable with a billing label.
    see_also: [Label, Firewall rule]
    verified: '2026-09-14'

  - term: Zone
    severity: medium
    aws:
      meaning: >-
        An Availability Zone consists of one or more datacenters. AZ names can map differently
        between accounts; AZ IDs identify the same physical zone across accounts.
      category: failure domain
      url: https://docs.aws.amazon.com/ram/latest/userguide/working-with-az-ids.html
    azure:
      meaning: >-
        Availability zone, the same idea, but not present in every region and opted into per
        resource.
      category: failure domain
      url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
    gcp:
      meaning: >-
        A deployment area within a region, named like us-central1-a.
      category: failure domain
      url: https://docs.cloud.google.com/compute/docs/regions-zones
    why_it_hurts: >-
      Compare AWS AZ IDs when physical alignment between accounts matters; equal AZ names do not
      guarantee it. Region and service support determine how zones can be selected. A DNS zone
      is a different meaning of the word.
    see_also: [Availability set, Region]
    verified: '2026-09-14'

  - term: Service account
    severity: medium
    aws:
      meaning: >-
        Not the term used. The equivalent is an IAM role assumed by a service.
      category: identity
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
    azure:
      meaning: >-
        Not the term used. The equivalent is a service principal, or a managed identity that
        wraps one.
      category: identity
      url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
    gcp:
      meaning: >-
        A workload identity that is also an IAM-managed resource. Permission to attach it
        differs from permission to generate access tokens and from the permissions used by the
        workload.
      category: identity and resource
      url: https://docs.cloud.google.com/iam/docs/service-account-permissions
    why_it_hurts: >-
      Service Account User supports attaching a Google service account; Token Creator supports
      credential generation. A grant to use the identity does not grant that identity permission
      to the application data. Check the intended authentication path.
    see_also: [Role, Managed identity, Principal]
    verified: '2026-09-14'

  - term: Image
    severity: low
    aws:
      meaning: >-
        Amazon Machine Image, an AMI. Regional, and must be copied to be used in another region.
      category: VM template
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html
    azure:
      meaning: >-
        A managed image, or a version published in an Azure Compute Gallery for replication and
        versioning.
      category: VM template
      url: https://learn.microsoft.com/en-us/azure/virtual-machines/azure-compute-gallery
    gcp:
      meaning: >-
        A custom image, which is a global resource usable from any region without copying.
      category: VM template
      url: https://docs.cloud.google.com/compute/docs/images
    why_it_hurts: >-
      Scope differs. Google images are global; AMIs are regional and need explicit copying,
      which is a step people forget in multi-region designs and which exam questions test
      directly.
    see_also: [Snapshot]
    verified: '2026-09-09'

  - term: Stack
    severity: low
    aws:
      meaning: >-
        A CloudFormation stack, the set of resources created and deleted together from one
        template.
      category: deployment unit
      url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacks.html
    azure:
      meaning: >-
        An Azure deployment stack manages a set of resources deployed from Bicep or ARM
        templates. Its deletion and detach behavior is configurable. Azure Stack is a separate
        hybrid product family.
      category: deployment unit
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/bicep/deployment-stacks
    gcp:
      meaning: >-
        Infrastructure Manager manages Terraform deployments. A deployment and its state are not
        a universal equivalent of an AWS CloudFormation stack.
      category: deployment unit
      url: https://docs.cloud.google.com/infrastructure-manager/docs/overview
    why_it_hurts: >-
      Azure deployment stacks exist and must not be confused with Azure Stack. In every
      provider, check retain, detach, deletion protection and state ownership rather than
      assuming deleting a deployment always deletes every resource.
    see_also: [Resource group]
    verified: '2026-09-14'

  - term: Reserved instance
    severity: low
    aws:
      meaning: >-
        An EC2 billing discount for matching usage. Regional Reserved Instances do not reserve
        capacity; zonal Reserved Instances include a capacity reservation. Savings Plans use a
        different commitment model.
      category: discount
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html
    azure:
      meaning: >-
        A reservation, purchased for one or three years.
      category: discount
      url: https://learn.microsoft.com/en-us/azure/cost-management-billing/reservations/save-compute-costs-reservations
    gcp:
      meaning: >-
        Committed use discounts and capacity reservations are separate mechanisms. Sustained use
        discounts apply automatically only to eligible usage.
      category: discount
      url: https://docs.cloud.google.com/compute/docs/sustained-use-discounts
    why_it_hurts: >-
      A discount is not necessarily guaranteed capacity. Verify reservation scope and eligible
      machine families, regions and purchase options. Google sustained use discounts are not a
      blanket reduction for every VM or for usage already receiving another incompatible
      discount.
    see_also: [Spot]
    verified: '2026-09-14'
