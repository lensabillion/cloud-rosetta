domain: compute
title: Compute and Containers
rows:
  - id: cmp.vm
    concept: Infrastructure-as-a-service virtual machine
    divergence: exact
    bite: tip
    aws:
      name: Amazon EC2
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html
    azure:
      name: Azure Virtual Machines
      url: https://learn.microsoft.com/en-us/azure/virtual-machines/overview
    gcp:
      name: Compute Engine
      url: https://docs.cloud.google.com/compute/docs/overview
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, CDL, ACE]
    verified: '2026-09-09'

  - id: cmp.autoscale
    concept: Horizontally scaling a pool of identical machines
    divergence: partial
    bite: regular
    aws:
      name: Auto Scaling group
      url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-groups.html
    azure:
      name: Virtual Machine Scale Set
      url: https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview
    gcp:
      name: Managed instance group
      url: https://docs.cloud.google.com/compute/docs/instance-groups
    breaks_when: >-
      A Google managed instance group is created as either zonal or regional, and the regional
      form spreads instances across zones for you. An AWS Auto Scaling group achieves the same
      thing by being given subnets in several availability zones, because the subnet is what
      carries the zone. Note the acronym trap: AWS ASG means Auto Scaling group, while Azure ASG
      means application security group, an unrelated networking object.
    exam_tags: [SAA-C03, SOA-C03, AZ-104, ACE]
    verified: '2026-09-09'

  - id: cmp.functions
    concept: Event-driven function as a service
    divergence: partial
    bite: regular
    aws:
      name: AWS Lambda
      url: https://docs.aws.amazon.com/lambda/latest/dg/welcome.html
    azure:
      name: Azure Functions
      url: https://learn.microsoft.com/en-us/azure/azure-functions/functions-overview
    gcp:
      name: Cloud Run functions
      url: https://docs.cloud.google.com/functions/docs/concepts/version-comparison
      formerly: [Cloud Functions, Cloud Functions (2nd gen)]
    breaks_when: >-
      Cloud Functions (2nd gen) is now Cloud Run functions and uses the Cloud Run service model.
      The first generation remains distinct. Azure Functions behavior depends on the hosting
      plan, including timeout, scaling, and cold starts. AWS Lambda has its own invocation and
      concurrency model. A familiar function name does not establish identical runtime limits;
      check the generation, trigger, and hosting plan.
    exam_tags: [CLF-C02, DVA-C02, AZ-900, CDL, ACE]
    sources:
      - https://docs.cloud.google.com/functions/docs/concepts/version-comparison
      - https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
      - https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
    verified: '2026-09-10'

  - id: cmp.serverless-containers
    concept: Running a container without managing servers
    divergence: partial
    bite: regular
    aws:
      name: AWS Fargate
      url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
    azure:
      name: Azure Container Apps
      url: https://learn.microsoft.com/en-us/azure/container-apps/overview
    gcp:
      name: Cloud Run
      url: https://docs.cloud.google.com/run/docs/overview/what-is-cloud-run
    breaks_when: >-
      Fargate supplies compute for ECS or EKS, so an orchestrator remains part of the design.
      Azure Container Apps and Cloud Run expose a managed application deployment experience.
      Cloud Run services can scale to zero by default, but minimum instances and billing mode
      change idle behavior and cost. Storage, networking, databases, and other dependencies can
      still incur charges while application instances are at zero. Compare the whole
      architecture and the selected hosting plan.
    exam_tags: [SAA-C03, DVA-C02, ACE]
    sources:
      - https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
      - https://learn.microsoft.com/en-us/azure/container-apps/overview
      - https://docs.cloud.google.com/run/docs/about-instance-autoscaling
      - https://docs.cloud.google.com/run/docs/configuring/billing-settings
    verified: '2026-09-10'

  - id: cmp.kubernetes
    concept: Managed Kubernetes
    divergence: partial
    bite: regular
    aws:
      name: Amazon EKS
      url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
    azure:
      name: Azure Kubernetes Service
      url: https://learn.microsoft.com/en-us/azure/aks/what-is-aks
    gcp:
      name: Google Kubernetes Engine
      url: https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview
    breaks_when: >-
      Compare the operating mode, not just the Kubernetes service name. GKE Autopilot, EKS Auto
      Mode, and AKS Automatic all reduce infrastructure management, with different node
      controls, workload constraints, upgrade behavior, and billing. They are relevant
      alternatives, not identical products. GKE Autopilot billing can depend on workload and
      compute class; do not assume every workload is billed only by requested pod resources.
      Check the selected mode, region, and supported features.
    exam_tags: [SAA-C03, DVA-C02, AZ-104, ACE]
    sources:
      - https://docs.aws.amazon.com/eks/latest/userguide/automode.html
      - https://learn.microsoft.com/en-us/azure/aks/intro-aks-automatic
      - https://docs.cloud.google.com/kubernetes-engine/docs/concepts/autopilot-overview
    verified: '2026-09-10'

  - id: cmp.paas
    concept: Deploy code, platform manages the runtime
    divergence: partial
    bite: regular
    aws:
      name: AWS Elastic Beanstalk
      url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html
    azure:
      name: Azure App Service
      url: https://learn.microsoft.com/en-us/azure/app-service/overview
    gcp:
      name: App Engine
      url: https://docs.cloud.google.com/appengine/docs/an-overview-of-app-engine
    breaks_when: >-
      The deployment and operating units differ. Azure App Service has deployment slots; Elastic
      Beanstalk manages visible AWS resources and supports blue/green deployment through
      environment URL swaps; App Engine supports versions and traffic allocation. These are
      related release patterns with different configuration, scaling, and rollback behavior.
      Compare the runtime, plan, and deployment unit rather than claiming that staging exists in
      only one cloud.
    exam_tags: [CLF-C02, DVA-C02, AZ-900, CDL]
    sources:
      - https://learn.microsoft.com/en-us/azure/app-service/deploy-staging-slots
      - https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.CNAMESwap.html
      - https://docs.cloud.google.com/appengine/docs/standard/splitting-traffic
    verified: '2026-09-10'

  - id: cmp.spot
    concept: Interruptible discounted capacity
    divergence: exact
    bite: regular
    aws:
      name: EC2 Spot Instances
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html
    azure:
      name: Azure Spot Virtual Machines
      url: https://learn.microsoft.com/en-us/azure/virtual-machines/spot-vms
    gcp:
      name: Spot VMs
      url: https://docs.cloud.google.com/compute/docs/instances/spot
      formerly: [Preemptible VMs]
    shared_trap: >-
      The concept transfers cleanly, and the naming history is the trap. Google's older
      preemptible VMs had a hard 24-hour maximum lifetime; Spot VMs do not, and material written
      before the change still teaches the 24-hour limit. All three remain unsuitable for
      anything that cannot tolerate reclamation at short notice.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, CDL, ACE]
    verified: '2026-09-09'
