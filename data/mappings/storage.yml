domain: storage
title: Storage
rows:
  - id: sto.object
    concept: Object storage
    divergence: partial
    bite: regular
    aws:
      name: Amazon S3
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
    azure:
      name: Azure Blob Storage
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/storage-blobs-introduction
    gcp:
      name: Cloud Storage
      url: https://docs.cloud.google.com/storage/docs/introduction
    breaks_when: >-
      Azure Blob Storage uses a container within a storage account; the account carries settings
      such as redundancy and naming. S3 and Cloud Storage expose buckets. An Azure blob
      container is unrelated to the container image used to package an application. Google
      bucket location options include regional, dual-region, and multi-region; compare these
      with replication and redundancy configurations in the other providers rather than assuming
      identical placement controls.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, CDL, ACE]
    verified: '2026-09-10'

  - id: sto.archive-tier
    concept: Cheapest archival storage tier
    divergence: none
    bite: serious
    aws:
      name: S3 Glacier Deep Archive
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
    azure:
      name: Archive access tier
      url: https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
    gcp:
      name: Archive storage class
      url: https://docs.cloud.google.com/storage/docs/storage-classes
    breaks_when: >-
      Retrieval behaviour differs fundamentally and decides questions. Google's Archive class is
      online: it has the same millisecond first-byte latency as Standard and you simply pay more
      to read it, with a 365-day minimum storage duration. AWS Glacier Flexible Retrieval and
      Deep Archive are offline and need a restore job taking minutes to hours. The Azure Archive
      tier is also offline and needs rehydration, which can take hours. So "archive but must be
      readable instantly" is achievable natively on Google, needs Glacier Instant Retrieval on
      AWS, and is not the Archive tier on Azure. Minimum durations also differ, and early
      deletion is charged as if the object had been kept for the minimum.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, CDL, ACE]
    sources:
      - https://docs.cloud.google.com/storage/docs/storage-classes
      - https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview
    verified: '2026-09-09'

  - id: sto.block
    concept: Network-attached block storage for a VM
    divergence: partial
    bite: regular
    aws:
      name: Amazon EBS
      url: https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html
    azure:
      name: Azure managed disks
      url: https://learn.microsoft.com/en-us/azure/virtual-machines/managed-disks-overview
    gcp:
      name: Persistent Disk and Hyperdisk
      url: https://docs.cloud.google.com/compute/docs/disks
    breaks_when: >-
      Google Persistent Disk can be created as regional, replicating synchronously across two
      zones in a region, which EBS cannot do; EBS volumes are strictly zonal and cross-zone
      resilience is a snapshot-and-restore or replication-at-the-application-layer problem.
      Google disks can also be resized and attached read-only to many instances at once, which
      changes what architectures are available.
    exam_tags: [SAA-C03, SOA-C03, AZ-104, ACE]
    verified: '2026-09-09'

  - id: sto.file
    concept: Shared network file system
    divergence: partial
    bite: regular
    aws:
      name: Amazon EFS, or FSx
      url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
    azure:
      name: Azure Files
      url: https://learn.microsoft.com/en-us/azure/storage/files/storage-files-introduction
    gcp:
      name: Filestore
      url: https://docs.cloud.google.com/filestore/docs/overview
    breaks_when: >-
      Protocol support differs and is the deciding factor. Azure Files serves SMB and NFS, so it
      is the natural answer for Windows workloads and can be mounted directly from on-premises.
      EFS is NFS only, and Windows or Lustre workloads go to the separate FSx family. Filestore
      is NFS only.
    exam_tags: [SAA-C03, AZ-104, ACE]
    verified: '2026-09-09'

  - id: sto.redundancy
    concept: Naming the replication and durability setting
    divergence: none
    bite: serious
    aws:
      name: Storage class, with zonal scope implied by the class
      url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
    azure:
      name: LRS, ZRS, GRS, GZRS, RA-GRS
      url: https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
    gcp:
      name: Location type, region, dual-region or multi-region
      url: https://docs.cloud.google.com/storage/docs/locations
    breaks_when: >-
      Azure configures redundancy on the storage account: LRS is local, ZRS spans zones, and
      geo-redundant options add asynchronous replication to a second region. Read-access
      variants expose the secondary. S3 storage classes include both One Zone-IA and Express One
      Zone as single-zone choices; other classes have different resilience and retrieval
      characteristics. Google Cloud Storage separates location type from storage class. Choose
      resilience and access behavior independently where the platform allows it.
    exam_tags: [AZ-900, AZ-104, AZ-305]
    sources:
      - https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
      - https://learn.microsoft.com/en-us/azure/storage/common/storage-redundancy
      - https://docs.cloud.google.com/storage/docs/locations
    verified: '2026-09-10'
