domain: identity
title: Identity and Access
rows:
  - id: iam.role
    concept: The object called a "role"
    divergence: none
    bite: serious
    aws:
      name: IAM role
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
    azure:
      name: Azure role definition
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/role-definitions
    gcp:
      name: IAM role
      url: https://docs.cloud.google.com/iam/docs/roles-overview
    breaks_when: >-
      These are different categories of object. An AWS role is an identity you assume, with its
      own temporary credentials issued by STS and a trust policy naming who may assume it. An
      Azure or Google role is a named set of permissions that carries no credentials and does
      nothing until assigned to a separate principal at a scope. The nearest AWS equivalent of
      an Azure or Google role is a managed policy; the nearest Azure or Google equivalent of an
      AWS role is a service principal or service account.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, CDL, ACE]
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles.html
    verified: '2026-09-09'

  - id: iam.machine-identity
    concept: Credentials for compute without stored secrets
    divergence: partial
    bite: serious
    aws:
      name: IAM role via instance profile
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
    azure:
      name: Managed identity
      url: https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
    gcp:
      name: Attached service account
      url: https://docs.cloud.google.com/iam/docs/service-account-overview
    breaks_when: >-
      Azure system-assigned identities follow the resource lifecycle; user-assigned identities
      are independent. An EC2 role is attached through an instance profile; other AWS runtimes
      use their own role integration. In Google Cloud, permission to attach a service account
      (actAs) is distinct from permission to mint its credentials. Neither automatically grants
      the service account access to application data.
    exam_tags: [SAA-C03, DVA-C02, AZ-104, ACE]
    sources:
      - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/overview
      - https://docs.cloud.google.com/iam/docs/service-account-overview
      - https://docs.cloud.google.com/iam/docs/service-account-permissions
    verified: '2026-09-14'

  - id: iam.evaluation
    concept: How a permission decision is reached
    divergence: none
    bite: serious
    aws:
      name: IAM policy evaluation by request context
      url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
    azure:
      name: Deny assignment, then additive union of role assignments
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
    gcp:
      name: Deny policy, then additive union of allow policy bindings
      url: https://docs.cloud.google.com/iam/docs/deny-overview
    breaks_when: >-
      AWS evaluates applicable grants and restrictions rather than requiring an allow at every
      stage of a universal pipeline. Identity-based grants are constrained by boundaries and
      applicable organization or session policies. Same-account resource-based grants can behave
      differently depending on whether they name a user, role, or role session; an applicable
      explicit deny still wins. Azure RBAC and Google IAM allow grants inherit down their
      resource hierarchies, but deny controls and conditions must also be considered. A narrower
      role at a child scope does not remove an inherited grant.
    exam_tags: [SAA-C03, SCS-C03, AZ-104, ACE]
    sources:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
      - https://learn.microsoft.com/en-us/azure/role-based-access-control/overview
      - https://docs.cloud.google.com/iam/docs/deny-overview
    verified: '2026-09-10'

  - id: iam.two-role-systems
    concept: Administering the directory versus administering resources
    divergence: partial
    bite: serious
    aws:
      name: IAM Identity Center administration and account IAM
      url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
    azure:
      name: Microsoft Entra roles and Azure RBAC roles
      url: https://learn.microsoft.com/en-us/azure/role-based-access-control/rbac-and-directory-admin-roles
    gcp:
      name: Cloud Identity super administrator and organization IAM roles
      url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-organization
    breaks_when: >-
      Directory administration and workload access are different responsibilities in all three
      ecosystems. An Azure Global Administrator does not automatically receive resource
      permissions: elevation grants User Access Administrator at root scope, from which resource
      access can be assigned. Google Workspace or Cloud Identity super administrators manage the
      directory; Organization Administrator manages organization IAM and is not an unrestricted
      workload superuser. AWS Identity Center administration likewise does not replace the
      permission sets and IAM roles used to access member-account resources.
    exam_tags: [AZ-900, AZ-104, SC-300]
    sources:
      - https://learn.microsoft.com/en-us/azure/role-based-access-control/elevate-access-global-admin
      - https://docs.cloud.google.com/resource-manager/docs/creating-managing-organization
      - https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
    verified: '2026-09-10'

  - id: iam.workforce-sso
    concept: Workforce single sign-on into the cloud
    divergence: partial
    bite: regular
    aws:
      name: IAM Identity Center
      url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      formerly: [AWS SSO]
    azure:
      name: Microsoft Entra ID
      url: https://learn.microsoft.com/en-us/entra/fundamentals/whatis
      formerly: [Azure Active Directory, Azure AD]
    gcp:
      name: Cloud Identity, or Workforce Identity Federation
      url: https://docs.cloud.google.com/iam/docs/workforce-identity-federation
    breaks_when: >-
      Azure subscriptions trust an Entra tenant. AWS IAM Identity Center provides workforce
      access using permission sets and account roles and can connect an external identity
      provider. Google Cloud Identity and Workforce Identity Federation offer different
      directory and federation models. Compare the source of identities, federation
      configuration and resource grants rather than treating a directory as permission to all
      workloads.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, ACE]
    sources:
      - https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
      - https://docs.cloud.google.com/iam/docs/workforce-identity-federation
    verified: '2026-09-14'

  - id: iam.secrets
    concept: Storing application secrets
    divergence: partial
    bite: regular
    aws:
      name: Secrets Manager, or SSM Parameter Store
      url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html
    azure:
      name: Azure Key Vault
      url: https://learn.microsoft.com/en-us/azure/key-vault/general/overview
    gcp:
      name: Secret Manager
      url: https://docs.cloud.google.com/secret-manager/docs/overview
    breaks_when: >-
      Key Vault includes secrets, cryptographic keys and certificates; AWS and Google expose
      separate services for some of those roles. Secrets Manager supports configured rotation
      using managed integrations or Lambda, but storing a secret does not automatically
      configure working rotation. Parameter Store supports secure parameters; rotation and
      pricing depend on tier and integration. Verify the secret type, rotation mechanism and
      application behavior.
    exam_tags: [SAA-C03, DVA-C02, SCS-C03, AZ-104, ACE]
    sources:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
    verified: '2026-09-14'
