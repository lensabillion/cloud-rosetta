domain: networking
title: Networking
rows:
  - id: net.firewall.instance
    concept: Instance-level traffic filtering
    divergence: partial
    bite: serious
    aws:
      name: Security group
      url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
    azure:
      name: Network security group
      url: https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
    gcp:
      name: VPC firewall rule
      url: https://docs.cloud.google.com/firewall/docs/firewalls
    breaks_when: >-
      An AWS security group has allow rules, not explicit deny rules. If broad allow rules must
      remain while one address is blocked, use an appropriate deny-capable control, such as a
      network ACL, network firewall, or application-layer control where applicable. Azure NSGs
      and Google VPC firewall rules support allow and deny decisions with priorities. Google VPC
      firewall rules belong to the network and select targets; do not assume all three attach
      and evaluate identically.
    exam_tags: [CLF-C02, SAA-C03, AZ-104, AZ-700, ACE]
    sources:
      - https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
      - https://learn.microsoft.com/en-us/azure/virtual-network/network-security-groups-overview
      - https://docs.cloud.google.com/firewall/docs/firewalls
    verified: '2026-09-10'

  - id: net.firewall.subnet
    concept: Stateless subnet-level filtering
    divergence: none
    bite: regular
    aws:
      name: Network ACL
      url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
    azure:
      name: null
      note: An NSG on the subnet fills this position but is stateful.
    gcp:
      name: null
      note: VPC firewall rules are stateful; they do not reproduce the AWS network ACL model.
    breaks_when: >-
      AWS network ACLs are stateless: allowing an inbound request does not automatically permit
      its outbound reply. Return traffic needs a matching rule. Azure NSGs and the Google VPC
      firewall rules compared here are stateful, so their connection tracking differs. This
      comparison concerns these native controls, not every possible firewall appliance or policy
      product.
    exam_tags: [SAA-C03, SOA-C03]
    verified: '2026-09-10'

  - id: net.private-service-access
    concept: Reaching a managed service without traversing the internet
    divergence: none
    bite: serious
    aws:
      name: VPC endpoint, gateway or interface
      url: https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html
    azure:
      name: Private endpoint, and separately service endpoint
      url: https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
    gcp:
      name: Private Service Connect, and separately Private Google Access
      url: https://docs.cloud.google.com/vpc/docs/private-service-connect
    breaks_when: >-
      A private endpoint provides a private destination address for a supported service;
      routing, DNS, authorization and service configuration must still permit access. Azure
      service endpoints instead retain the service public address and do not extend to
      on-premises clients. AWS gateway endpoints provide route-based access to S3 and DynamoDB
      without an endpoint fee; they are not reachable through VPN, Direct Connect or peering.
      Interface endpoints use PrivateLink and have service-specific support and charges. Google
      Private Service Connect and Private Google Access are different mechanisms.
    exam_tags: [SAA-C03, AZ-104, AZ-700, ACE]
    sources:
      - https://learn.microsoft.com/en-us/azure/private-link/private-endpoint-overview
      - https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
      - https://docs.cloud.google.com/vpc/docs/private-service-connect
    verified: '2026-09-14'

  - id: net.lb.l7-global
    concept: Global layer 7 load balancing
    divergence: partial
    bite: regular
    aws:
      name: Amazon CloudFront
      url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
    azure:
      name: Azure Front Door
      url: https://learn.microsoft.com/en-us/azure/frontdoor/front-door-overview
    gcp:
      name: Global external Application Load Balancer
      url: https://docs.cloud.google.com/load-balancing/docs/https
    breaks_when: >-
      CloudFront and Front Door are global HTTP reverse-proxy services; neither is
      interchangeable with a regional application load balancer. Google offers a global external
      Application Load Balancer. Traffic Manager and Route 53 DNS routing select DNS answers
      rather than carrying application traffic. AWS Global Accelerator handles TCP/UDP traffic
      and is not a layer-7 routing engine. A global entry point does not make a single-region
      origin resilient to regional failure.
    exam_tags: [SAA-C03, AZ-104, AZ-305, AZ-700, ACE]
    sources:
      - https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
      - https://learn.microsoft.com/en-us/azure/traffic-manager/traffic-manager-overview
    verified: '2026-09-14'

  - id: net.lb.l7-regional
    concept: Regional layer 7 load balancing
    divergence: exact
    bite: tip
    aws:
      name: Application Load Balancer
      url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
    azure:
      name: Application Gateway
      url: https://learn.microsoft.com/en-us/azure/application-gateway/overview
    gcp:
      name: Regional external Application Load Balancer
      url: https://docs.cloud.google.com/load-balancing/docs/application-load-balancer
    exam_tags: [SAA-C03, AZ-104, ACE]
    verified: '2026-09-09'

  - id: net.peering
    concept: Connecting two virtual networks
    divergence: exact
    bite: regular
    aws:
      name: VPC peering
      url: https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html
    azure:
      name: Virtual network peering
      url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview
    gcp:
      name: VPC Network Peering
      url: https://docs.cloud.google.com/vpc/docs/vpc-peering
    shared_trap: >-
      Peering between A and B and between B and C does not by itself give A a transit path to C
      in any of these three services. Check address-range overlap and supported route types:
      peering products have provider-specific restrictions and exceptions. A transitive design
      requires a supported transit or routing solution, not a chain of ordinary peerings.
    exam_tags: [SAA-C03, AZ-104, AZ-700, ACE]
    verified: '2026-09-10'

  - id: net.nat
    concept: Outbound internet for private instances
    divergence: partial
    bite: regular
    aws:
      name: NAT gateway
      url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
    azure:
      name: Azure NAT Gateway
      url: https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
    gcp:
      name: Cloud NAT
      url: https://docs.cloud.google.com/nat/docs/overview
    breaks_when: >-
      AWS offers zonal and regional NAT gateways. Zonal gateways require an explicit per-zone
      design for zone resilience; regional gateways support automatic expansion across workload
      zones, with documented expansion delays and mode restrictions. Regional NAT does not
      support private NAT. Azure NAT Gateway capabilities depend on SKU and configuration.
      Google Cloud NAT is distributed translation, not a proxy VM through which packets are
      routed. NAT is not an inbound publishing or application-authentication mechanism.
    exam_tags: [SAA-C03, SOA-C03, AZ-104, ACE]
    sources:
      - https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
      - https://learn.microsoft.com/en-us/azure/nat-gateway/nat-overview
      - https://docs.cloud.google.com/nat/docs/overview
    verified: '2026-09-14'

  - id: net.hybrid-private
    concept: Private circuit to on-premises
    divergence: exact
    bite: tip
    aws:
      name: AWS Direct Connect
      url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html
    azure:
      name: Azure ExpressRoute
      url: https://learn.microsoft.com/en-us/azure/expressroute/expressroute-introduction
    gcp:
      name: Cloud Interconnect
      url: https://docs.cloud.google.com/network-connectivity/docs/interconnect
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, CDL, ACE]
    verified: '2026-09-09'
