domain: hierarchy
title: Resource Hierarchy and Scoping
rows:
  - id: hier.isolation-boundary
    concept: The primary workload isolation boundary
    divergence: partial
    bite: serious
    aws:
      name: Account
      url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_getting-started_concepts.html
    azure:
      name: Subscription
      url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ready/azure-best-practices/initial-subscriptions
    gcp:
      name: Project
      url: https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
    breaks_when: >-
      An AWS account is a resource and IAM administration boundary, but workforce identities can
      be federated and Organizations can consolidate charges. Azure subscriptions are resource
      and billing scopes associated with an Entra tenant. Google projects hold workload
      resources and link to a billing account. Resource ownership, identity administration and
      payment responsibility must be designed separately in every cloud.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, CDL, ACE]
    sources:
      - https://docs.cloud.google.com/resource-manager/docs/cloud-platform-resource-hierarchy
      - https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
    verified: '2026-09-14'

  - id: hier.grouping-above
    concept: Grouping container above the isolation boundary
    divergence: partial
    bite: regular
    aws:
      name: Organizational unit
      url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_ous.html
    azure:
      name: Management group
      url: https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
    gcp:
      name: Folder
      url: https://docs.cloud.google.com/resource-manager/docs/creating-managing-folders
    breaks_when: >-
      OUs, management groups and folders organize workload boundaries and inherited policy; they
      are not geographic regions. Their nesting limits differ. A Google folder must be empty
      before deletion. Consult current quotas rather than assuming identical depths or lifecycle
      behavior.
    exam_tags: [SAA-C03, AZ-104, AZ-305, ACE]
    sources:
      - https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
      - https://learn.microsoft.com/en-us/azure/governance/management-groups/overview
      - https://docs.cloud.google.com/resource-manager/docs/limits
      - https://docs.cloud.google.com/resource-manager/docs/creating-managing-folders
    verified: '2026-09-14'

  - id: hier.grouping-below
    concept: Grouping container below the isolation boundary
    divergence: none
    bite: serious
    aws:
      name: Resource group
      url: https://docs.aws.amazon.com/ARG/latest/userguide/welcome.html
      note: Optional resource grouping; deleting the group does not delete members.
    azure:
      name: Resource group
      url: https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
      note: Lifecycle container for resources deployed at resource-group scope.
    gcp:
      name: null
      note: No equivalent. Labels and separate projects do this job.
    breaks_when: >-
      An Azure resource group is a lifecycle and management scope for resources deployed at
      resource-group scope. Deleting the group initiates deletion of its contents, subject to
      locks, dependencies, and service behavior. An AWS Resource Group is a grouping/query
      construct; deleting that group does not delete its member resources. Google projects and
      labels provide different grouping boundaries. Not every Azure resource type is deployed at
      resource-group scope.
    exam_tags: [AZ-900, AZ-104, SAA-C03]
    sources:
      - https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/overview
      - https://docs.aws.amazon.com/ARG/latest/userguide/welcome.html
      - https://docs.cloud.google.com/resource-manager/docs/creating-managing-projects
    verified: '2026-09-15'

  - id: hier.virtual-network-scope
    concept: Scope of the virtual network object
    divergence: none
    bite: serious
    aws:
      name: VPC, regional
      url: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
    azure:
      name: Virtual network, regional
      url: https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
    gcp:
      name: VPC network, global
      url: https://docs.cloud.google.com/vpc/docs/vpc
    breaks_when: >-
      A Google VPC is a global object spanning every region and carries no CIDR of its own; the
      subnets hold the ranges and are regional. One Google VPC can contain instances in Tokyo
      and Frankfurt that route to each other over Google's backbone with no peering. AWS and
      Azure networks are regional, so the same design needs peering or a transit construct. An
      AWS subnet additionally lives in exactly one availability zone, whereas Azure and Google
      subnets are regional and span zones.
    exam_tags: [SAA-C03, AZ-104, AZ-700, ACE]
    sources:
      - https://docs.cloud.google.com/vpc/docs/vpc
      - https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
      - https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview
    verified: '2026-09-15'

  - id: hier.failure-domain
    concept: Independent failure domain within a region
    divergence: partial
    bite: serious
    aws:
      name: Availability Zone
      url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
    azure:
      name: Availability zone
      url: https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
    gcp:
      name: Zone
      url: https://docs.cloud.google.com/compute/docs/regions-zones
    breaks_when: >-
      An Azure availability set distributes VMs across fault and update domains; it does not
      provide protection from losing a whole datacenter. Zone resilience requires resources
      distributed across zones and a working failover design, not simply selecting one zone. AWS
      AZ names can map differently between accounts; use AZ IDs when physical alignment matters.
    exam_tags: [CLF-C02, SAA-C03, AZ-900, AZ-104, ACE]
    sources:
      - https://learn.microsoft.com/en-us/azure/reliability/availability-zones-overview
      - https://docs.aws.amazon.com/ram/latest/userguide/working-with-az-ids.html
      - https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview
    verified: '2026-09-14'

  - id: hier.org-guardrail
    concept: Organization-wide preventive guardrail
    divergence: partial
    bite: serious
    aws:
      name: Service control policy
      url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
    azure:
      name: Azure Policy
      url: https://learn.microsoft.com/en-us/azure/governance/policy/overview
    gcp:
      name: Organization policy constraint
      url: https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
    breaks_when: >-
      An SCP restricts the permissions available to affected member-account principals and never
      grants access. SCPs do not restrict the management account or service-linked roles. Azure
      Policy and Google Organization Policy govern resource configuration; the supported effects
      and enforcement points differ. Check the applicable control, scope and exceptions rather
      than treating governance policy as a permission grant.
    exam_tags: [SAA-C03, SAP-C02, AZ-104, AZ-305, ACE]
    sources:
      - https://docs.aws.amazon.com/organizations/latest/userguide/orgs_reference_limits.html
      - https://learn.microsoft.com/en-us/azure/governance/policy/overview
      - https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
      - https://docs.cloud.google.com/resource-manager/docs/organization-policy/overview
    verified: '2026-09-14'
