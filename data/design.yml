# The design lives here. Nothing else defines a colour, a size or a spacing value.
#
# scripts/design.py turns this into the :root custom properties in the built page
# and renders the Design page that shows every token in use. Change a value here
# and both follow; there is no second place to edit.
#
# Provenance: the palette and type scale are taken from the Elegant Themes blog,
# measured from computed styles at a 1280px viewport on 15 September 2026. The
# layout and navigation are taken from react.dev, read from its source on
# 17 September 2026. Deviations from either source are recorded in `deviations`
# below rather than made silently.

meta:
  name: Cloud Rosetta
  source: https://www.elegantthemes.com/blog/resources/git-and-github-a-beginners-guide-for-complete-newbies
  measured: '2026-09-15'
  layout_source: https://github.com/reactjs/react.dev
  layout_read: '2026-09-17'

fonts:
  stacks:
    text: '"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'
    sans: '"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'
    serif: '"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'
    mono: '"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'
  google: 'family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400..500'

type:
  # Six sizes, matching the source's six. Rounded to whole pixels: the source
  # computes 36.8, 28.8 and 14.45 from multipliers, and a designed scale should
  # land on round numbers.
  scale:
    t-title: 37px
    t-section: 29px
    t-sub: 24px
    t-body: 19px
    t-nav: 17px
    t-label: 14px
    # Narrow screens step the two display sizes down; nothing else changes.
    t-title-sm: 28px
    t-section-sm: 23px
  leading:
    lh-body: '1.9'
    lh-head: '1.4'
    lh-tight: '1.2'

layout:
  # The frame, from react.dev's source: tailwind.config.js, Layout/Page.tsx,
  # TopNav.tsx, Sidebar/SidebarLink.tsx, Toc.tsx and DocsFooter.tsx. Tailwind
  # classes resolved to pixels.
  nav-height: 64px          # h-16, the sticky top bar
  side: 320px               # grid column sidebar-content, 20rem
  toc: 320px                # third grid column sidebar-content-toc, 20rem
  content: 896px            # max-w-4xl, the reading column
  content-frame: 1280px     # max-w-7xl, what the column centres within on wide screens
  figure-wide: 1152px       # max-w-6xl, how wide a drawing may grow on wide screens
  gutter: 20px              # px-5
  gutter-wide: 48px         # sm:px-12
  control: 48px             # w-12 h-12, round icon buttons in the top bar
  search-height: 40px       # h-10, the search button
  tab-pad-y: 6px            # py-1.5, section tabs
  tab-pad-x: 16px           # px-4
  nav-item-pad: 8px         # p-2, sidebar and outline items
  nav-indent: 20px          # ps-5, top-level sidebar items and group headings
  nav-indent-sub: 24px      # ps-6, nested sidebar items
  radius-nav: 16px          # rounded-e-2xl, the selected sidebar item
  # Table chrome, taken from the shadcn/ui component source (table.tsx,
  # new-york-v4) on 16 September 2026: h-10 40px header row, p-2 8px cells.
  table-head: 40px
  table-pad: 8px
  gap-section: 69px
  gap-para: 24px
  radius: 6px
  radius-pill: 100px

# react.dev's Tailwind screens. Media queries cannot read custom properties, so
# scripts/guide.py writes these into the stylesheet's {{bp-*}} placeholders.
breakpoints:
  bp-sm: 640px              # wider gutters
  bp-md: 768px              # the search button replaces the search icon
  bp-lg: 1024px             # the sidebar is always visible; tabs move into the top bar
  bp-2xl: 1536px            # the page outline appears as a third column

