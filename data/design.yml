# Colours the source uses that this project keeps for accents only, never for
# body text or large areas.
palette_extra:
  violet: '#4A42EC'
  purple: '#8F42EC'
  mint: '#34DDA9'

deviations:
  - what: The frame is react.dev's, the colours and typeface are not
    why: >-
      Requested on 17 September 2026. The layout and navigation are copied from
      react.dev, read from its source, because it is a learning site with a reference
      half and the same journey-then-reference split this guide needs. Its palette was
      not wanted, and its typefaces, Optimistic Display and Optimistic Text, are Meta's
      and not licensed for reuse. The palette, Lato and the type scale stay as measured
      from the Elegant Themes blog. This supersedes the full-width decision made earlier
      the same day.
  - what: Sidebar and outline text use this guide's scale, not react.dev's sizes
    why: >-
      react.dev sets sidebar items at 15px and nested items, group headings and the
      outline at 13px, below this guide's 14px floor. Each one instead takes the step of
      this scale at the same proportion of body text, so the hierarchy reads the same at
      19px body: 17px for a top-level item, 14px for everything below it.
  - what: Drawings scale to the column instead of scrolling sideways
    why: >-
      Requested on 17 September 2026. A 1440px drawing used to sit in a horizontally
      scrolling frame. It now fits the column and grows to 1152px from the 1536px
      breakpoint, as react.dev widens an illustration past its reading column. Labels
      shrink with the drawing, so every figure keeps its full-size SVG link.
  - what: Search is part of the page rather than a hosted service
    why: >-
      react.dev searches through Algolia DocSearch. This guide is one static document
      with no backend, so the dialog indexes the document it is in: page titles,
      headings, mapping rows and terms.
  - what: Table structure follows shadcn/ui, reproduced without React
    why: >-
      shadcn/ui is a set of React components installed with a JavaScript package
      manager. This guide is static HTML generated by Python and published as a single
      document, so the components cannot be installed. The table's composition, states
      and dimensions are reproduced instead, read from the component source rather than
      eyeballed, and expressed through this file. The sidebar followed shadcn until
      17 September 2026 and now follows react.dev.
  - what: Table cells wrap rather than staying on one line
    why: >-
      The shadcn table sets whitespace-nowrap on every head and cell, because it is
      built for short data values. Cells in this guide carry explanatory prose, and
      forcing one line would push every table metres wide. Headers stay on one line;
      cells wrap.
  - what: Official vendor artwork retains its original colors
    why: >-
      Service icons are unmodified provider assets, not interface colors. Recoloring
      would change the artwork. Labels, boundaries, connectors and backgrounds
      still use this file's palette; icons supplement readable service names.
  - what: Monospace is kept for code, identifiers and exam codes
    why: >-
      The source sets everything in one family, including shell commands in a Git
      tutorial. A reference guide has to let a reader tell a command from a
      sentence, so Roboto Mono stays.
  - what: Links keep an underline in running prose
    why: >-
      The source removes underlines and leans on colour alone, which fails for
      readers who cannot separate the blue from the surrounding navy. Colour is
      never the only signal here.
  - what: Type sizes are rounded to whole pixels
    why: >-
      The source computes fractional sizes from multipliers. Rounding keeps the
      same rhythm and makes the scale legible as a decision.
  - what: A dark theme is defined
    why: >-
      The source is light only. People revise at night, so the same tokens are
      given a dark counterpart rather than inverted at render time.

