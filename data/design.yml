# The design lives here. Nothing else defines a colour, a size or a spacing value.
#
# scripts/design.py turns this into the :root custom properties in the built page
# and renders the Design page that shows every token in use. Change a value here
# and both follow; there is no second place to edit.
#
# Provenance: the palette, type scale and spacing are taken from the Elegant
# Themes blog, measured from computed styles at a 1280px viewport on
# 15 September 2026. Deviations from that source are recorded in `deviations`
# below rather than made silently.

meta:
  name: Cloud Rosetta
  source: https://www.elegantthemes.com/blog/resources/git-and-github-a-beginners-guide-for-complete-newbies
  measured: '2026-09-15'

fonts:
  stacks:
    text: '"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'
    sans: '"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'
    serif: '"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif'
    mono: '"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'
  google: 'family=Lato:wght@400;700;900&family=Roboto+Mono:wght@400..500'

type:
  # Six sizes, matching the source's six. Rounded to whole pixels: the source
  # computes 36.8, 28.8 and 14.45 from multipliers, and a designed scale should
  # land on round numbers.
  scale:
    t-title: 37px
    t-section: 29px
    t-sub: 24px
    t-body: 19px
    t-nav: 17px
    t-label: 14px
    # Narrow screens step the two display sizes down; nothing else changes.
    t-title-sm: 28px
    t-section-sm: 23px
  leading:
    lh-body: '1.9'
    lh-head: '1.4'
    lh-tight: '1.2'

layout:
  architecture-width: 1440px
  prose: 640px
  wide: 880px
  side: 256px
  # Sidebar and table chrome, taken from the shadcn/ui component source
  # (sidebar.tsx, table.tsx, new-york-v4) on 16 September 2026. Tailwind
  # classes resolved to pixels: h-8 32px, h-7 28px, h-10 40px, p-2 8px, gap-1 4px.
  side-collapsed: 0px
  side-item: 32px
  side-sub-item: 28px
  side-pad: 8px
  side-gap: 4px
  side-sub-indent: 14px
  table-head: 40px
  table-pad: 8px
  gap-section: 69px
  gap-para: 24px
  radius: 6px
  radius-pill: 100px

