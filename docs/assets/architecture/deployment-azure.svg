<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" role="img" aria-labelledby="deployment-azure-title deployment-azure-desc" font-family="Arial, Helvetica, sans-serif"><title id="deployment-azure-title">Azure | Separate inbound and outbound private paths</title><desc id="deployment-azure-desc">Application Gateway WAF_v2 reaches App Service through an inbound private endpoint. App Service uses a separate delegated integration subnet for outbound SQL traffic. App Service and SQL are managed services outside the consumer VNet.</desc><defs><marker id="deployment-azure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34465a"/></marker></defs><rect width="960" height="1120" fill="#fff"/><text x="24" y="34" font-size="23" fill="#34465a" font-weight="700"><tspan x="24" dy="0">Azure | Separate inbound and outbound private paths</tspan></text><text x="24" y="61" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="1078" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="1099" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="194" y="90" width="332" height="64" rx="8" fill="#ffffff" stroke="#34465a" stroke-width="1.5"/><text x="208" y="114" font-size="15" fill="#34465a" font-weight="700"><tspan x="208" dy="0">Clients</tspan></text><text x="208" y="137" font-size="14" fill="#34465a" font-weight="400"><tspan x="208" dy="0">DNS resolves the gateway public IP</tspan></text><rect x="24" y="218" width="912" height="780" rx="8" fill="#f5f8fb" stroke="#12537f" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="242" font-size="15" fill="#12537f" font-weight="700"><tspan x="38" dy="0">Subscription | selected region</tspan></text><rect x="44" y="264" width="460" height="702" rx="8" fill="#f5f8fb" stroke="#12537f" stroke-width="1.5" stroke-dasharray="7 5"/><text x="58" y="288" font-size="15" fill="#12537f" font-weight="700"><tspan x="58" dy="0">Virtual network | regional</tspan></text><rect x="72" y="320" width="404" height="94" rx="8" fill="#ffffff" stroke="#12537f" stroke-width="1.5"/><text x="86" y="344" font-size="15" fill="#12537f" font-weight="700"><tspan x="86" dy="0">Application Gateway WAF_v2</tspan></text><text x="86" y="367" font-size="14" fill="#34465a" font-weight="400"><tspan x="86" dy="0">Dedicated subnet; zone redundant</tspan></text><path d="M360,154 L360,320" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-azure-arrow)"/><rect x="306.2" y="225.0" width="107.60000000000001" height="21" fill="#fff"/><text x="360.0" y="240.0" text-anchor="middle" font-size="13" fill="#34465a">1  HTTPS :443</text><rect x="72" y="502" width="404" height="90" rx="8" fill="#ffffff" stroke="#12537f" stroke-width="1.5"/><text x="86" y="526" font-size="15" fill="#12537f" font-weight="700"><tspan x="86" dy="0">App Service private endpoint</tspan></text><text x="86" y="549" font-size="14" fill="#34465a" font-weight="400"><tspan x="86" dy="0">Private endpoint subnet; inbound path</tspan></text><path d="M274,414 L274,502" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-azure-arrow)"/><rect x="238.2" y="446.0" width="71.6" height="21" fill="#fff"/><text x="274.0" y="461.0" text-anchor="middle" font-size="13" fill="#34465a">2  HTTPS</text><rect x="624" y="502" width="284" height="116" rx="8" fill="#ffffff" stroke="#12537f" stroke-width="1.5"/><text x="638" y="526" font-size="15" fill="#12537f" font-weight="700"><tspan x="638" dy="0">App Service</tspan></text><text x="638" y="549" font-size="14" fill="#34465a" font-weight="400"><tspan x="638" dy="0">Zone-redundant plan; public access</tspan><tspan x="638" dy="21">disabled</tspan></text><path d="M476,547 L624,547" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-azure-arrow)"/><rect x="489.0" y="535.0" width="122.0" height="21" fill="#fff"/><text x="550.0" y="550.0" text-anchor="middle" font-size="13" fill="#34465a">3  Private Link</text><rect x="72" y="692" width="404" height="90" rx="8" fill="#ffffff" stroke="#12537f" stroke-width="1.5"/><text x="86" y="716" font-size="15" fill="#12537f" font-weight="700"><tspan x="86" dy="0">VNet integration subnet</tspan></text><text x="86" y="739" font-size="14" fill="#34465a" font-weight="400"><tspan x="86" dy="0">Delegated to App Service; outbound path</tspan></text><path d="M760,618 L476,732" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-azure-arrow)"/><rect x="528.2" y="663.0" width="179.6" height="21" fill="#fff"/><text x="618.0" y="678.0" text-anchor="middle" font-size="13" fill="#34465a">4  outbound integration</text><rect x="72" y="850" width="404" height="90" rx="8" fill="#ffffff" stroke="#12537f" stroke-width="1.5"/><text x="86" y="874" font-size="15" fill="#12537f" font-weight="700"><tspan x="86" dy="0">SQL private endpoint</tspan></text><text x="86" y="897" font-size="14" fill="#34465a" font-weight="400"><tspan x="86" dy="0">Private DNS resolves the SQL hostname</tspan></text><path d="M274,782 L274,850" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-azure-arrow)"/><rect x="231.0" y="804.0" width="86.0" height="21" fill="#fff"/><text x="274.0" y="819.0" text-anchor="middle" font-size="13" fill="#34465a">5  SQL/TLS</text><rect x="624" y="838" width="284" height="116" rx="8" fill="#ffffff" stroke="#12537f" stroke-width="1.5"/><text x="638" y="862" font-size="15" fill="#12537f" font-weight="700"><tspan x="638" dy="0">Azure SQL Database</tspan></text><text x="638" y="885" font-size="14" fill="#34465a" font-weight="400"><tspan x="638" dy="0">Zone redundancy enabled on a</tspan><tspan x="638" dy="21">supported tier</tspan></text><path d="M476,896 L624,896" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-azure-arrow)"/><rect x="489.0" y="884.0" width="122.0" height="21" fill="#fff"/><text x="550.0" y="899.0" text-anchor="middle" font-size="13" fill="#34465a">6  Private Link</text><text x="44" y="1030" font-size="14" fill="#34465a" font-weight="400"><tspan x="44" dy="0">ACCESS  Managed identity + database grants; private connectivity alone grants no data access.</tspan></text><text x="44" y="1057" font-size="14" fill="#34465a" font-weight="400"><tspan x="44" dy="0">OPERATE  Azure Monitor / Application Insights • backups • restore and failover exercises</tspan></text></svg>
