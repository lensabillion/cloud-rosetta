<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="application-azure-title application-azure-desc" font-family="Arial, Helvetica, sans-serif"><title id="application-azure-title">Photo application | Azure</title><desc id="application-azure-desc">Logical service view, not VPC placement: a browser calls a protected application endpoint. Application code writes photo bytes to object storage and metadata to a database using its workload identity. The services are alternatives across providers, not exact equivalents.</desc><defs><marker id="application-azure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="960" height="690" fill="#fff"/><text x="24" y="34" font-size="23" fill="#375174" font-weight="700"><tspan x="24" dy="0">Photo application | Azure</tspan></text><text x="24" y="61" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="648" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="669" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="344" y="88" width="272" height="64" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="358" y="112" font-size="15" fill="#375174" font-weight="700"><tspan x="358" dy="0">Browser client</tspan></text><text x="358" y="135" font-size="14" fill="#375174" font-weight="400"><tspan x="358" dy="0">Authenticated application user</tspan></text><rect x="24" y="225" width="912" height="371" rx="8" fill="#F5F7FA" stroke="#3776FF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="249" font-size="15" fill="#3776FF" font-weight="700"><tspan x="38" dy="0">Azure subscription | logical resource ownership</tspan></text><rect x="344" y="272" width="272" height="94" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="358" y="296" font-size="15" fill="#3776FF" font-weight="700"><tspan x="358" dy="0">HTTP-triggered Functions</tspan></text><text x="358" y="319" font-size="14" fill="#375174" font-weight="400"><tspan x="358" dy="0">Validate requests and authorize</tspan><tspan x="358" dy="21">users</tspan></text><path d="M480,152 L480,272" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#application-azure-arrow)"/><rect x="419.0" y="200.0" width="122.0" height="21" fill="#fff"/><text x="480.0" y="215.0" text-anchor="middle" font-size="14" fill="#375174">1. HTTPS upload</text><rect x="66" y="450" width="332" height="94" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="80" y="474" font-size="15" fill="#3776FF" font-weight="700"><tspan x="80" dy="0">Blob Storage</tspan></text><text x="80" y="497" font-size="14" fill="#375174" font-weight="400"><tspan x="80" dy="0">Photo bytes; private data access</tspan></text><rect x="562" y="450" width="332" height="94" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="576" y="474" font-size="15" fill="#3776FF" font-weight="700"><tspan x="576" dy="0">Cosmos DB</tspan></text><text x="576" y="497" font-size="14" fill="#375174" font-weight="400"><tspan x="576" dy="0">Photo owner, caption and object key</tspan></text><path d="M408,366 L232,450" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#application-azure-arrow)"/><rect x="259.0" y="396.0" width="122.0" height="21" fill="#fff"/><text x="320.0" y="411.0" text-anchor="middle" font-size="14" fill="#375174">2. write object</text><path d="M552,366 L728,450" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#application-azure-arrow)"/><rect x="571.8" y="396.0" width="136.4" height="21" fill="#fff"/><text x="640.0" y="411.0" text-anchor="middle" font-size="14" fill="#375174">3. write metadata</text><text x="46" y="574" font-size="14" fill="#375174" font-weight="400"><tspan x="46" dy="0">Workload identity: Managed identity. Grant only required data operations.</tspan></text></svg>
