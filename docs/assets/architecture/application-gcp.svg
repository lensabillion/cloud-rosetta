<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870" role="img" aria-labelledby="application-gcp-title application-gcp-desc" font-family="&quot;Lato&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif"><title id="application-gcp-title">Google Cloud · Authorize the user, then write two kinds of data</title><desc id="application-gcp-desc">An authenticated user calls application code. Code authorizes access, writes object bytes and then metadata using its workload identity. The writes are separate operations and need idempotency and partial-failure recovery.</desc><defs><marker id="application-gcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="1440" height="870" fill="#FFFFFF"/><text x="24" y="48" font-size="29" font-weight="700" fill="#20292F">Google Cloud · Authorize the user, then write two kinds of data</text><text x="24" y="86" font-size="14" font-weight="400" fill="#375174">LOGICAL VIEW  /  private data access does not mean a private application endpoint</text><rect x="248" y="160" width="1164" height="480" rx="6" fill="none" stroke="#CBD4E0" stroke-width="1.5" stroke-dasharray="8,6"/><text x="264" y="188" font-size="14" font-weight="700" fill="#375174">Google Cloud workload ownership · logical services, not VPC placement</text><rect x="24" y="330" width="188" height="130" rx="6" fill="#FFFFFF" stroke="#CBD4E0" stroke-width="1.5"/><text x="40" y="358" font-size="17" font-weight="700" fill="#20292F">Application user</text><text x="40" y="382" font-size="14" font-weight="400" fill="#375174">Signed-in client;</text><text x="40" y="406" font-size="14" font-weight="400" fill="#375174">HTTPS request</text><rect x="614" y="330" width="308" height="130" rx="6" fill="#FFFFFF" stroke="#CBD4E0" stroke-width="1.5"/><image x="630" y="346" width="48" height="48" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="694" y="358" font-size="17" font-weight="700" fill="#20292F">Cloud Run</text><text x="694" y="382" font-size="14" font-weight="400" fill="#375174">Validate input; enforce</text><text x="694" y="406" font-size="14" font-weight="400" fill="#375174">object ownership</text><rect x="1060" y="230" width="324" height="132" rx="6" fill="#FFFFFF" stroke="#CBD4E0" stroke-width="1.5"/><image x="1076" y="246" width="48" height="48" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="1140" y="258" font-size="17" font-weight="700" fill="#20292F">Cloud Storage</text><text x="1140" y="282" font-size="14" font-weight="400" fill="#375174">Photo bytes; workload data</text><text x="1140" y="306" font-size="14" font-weight="400" fill="#375174">permissions</text><rect x="1060" y="464" width="324" height="132" rx="6" fill="#FFFFFF" stroke="#CBD4E0" stroke-width="1.5"/><image x="1076" y="480" width="48" height="48" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text x="1140" y="492" font-size="17" font-weight="700" fill="#20292F">Firestore</text><text x="1140" y="516" font-size="14" font-weight="400" fill="#375174">Owner, caption and object key</text><text x="48" y="722" font-size="17" font-weight="700" fill="#20292F">Two separate authorization decisions</text><text x="48" y="746" font-size="14" font-weight="400" fill="#375174">The application checks the end user. Service account grants the code only the</text><text x="48" y="770" font-size="14" font-weight="400" fill="#375174">object and database operations it needs. A successful login is not a grant to</text><text x="48" y="794" font-size="14" font-weight="400" fill="#375174">every object.</text><text x="768" y="722" font-size="17" font-weight="700" fill="#20292F">Design for a partial write</text><text x="768" y="746" font-size="14" font-weight="400" fill="#375174">If the object write succeeds but metadata fails, retry idempotently or</text><text x="768" y="770" font-size="14" font-weight="400" fill="#375174">reconcile the orphan. For large files, issue a short-lived signed upload URL</text><text x="768" y="794" font-size="14" font-weight="400" fill="#375174">after authorization; that alternate path is not drawn.</text><path d="M212,395 L614,395" fill="none" stroke="#375174" stroke-width="1.5" marker-end="url(#application-gcp-arrow)"/><rect x="287.24" y="360.0" width="235.52" height="22.0" fill="#FFFFFF"/><text x="295.24" y="378" font-size="14" font-weight="400" fill="#375174">1  HTTPS · authenticate user</text><path d="M922,374 L988,374 L988,296 L1060,296" fill="none" stroke="#375174" stroke-width="1.5" marker-end="url(#application-gcp-arrow)"/><rect x="922.12" y="262.0" width="125.76" height="22.0" fill="#FFFFFF"/><text x="930.12" y="280" font-size="14" font-weight="400" fill="#375174">2  write bytes</text><path d="M922,420 L988,420 L988,530 L1060,530" fill="none" stroke="#375174" stroke-width="1.5" marker-end="url(#application-gcp-arrow)"/><rect x="909.36" y="546.0" width="149.28" height="22.0" fill="#FFFFFF"/><text x="917.36" y="564" font-size="14" font-weight="400" fill="#375174">3  write metadata</text><text x="24" y="850" font-size="14" font-weight="400" fill="#375174">Solid arrows: labelled traffic or replication. Dashed arrows: policy/control. Conceptual design; assumptions and sources in the chapter.</text></svg>
