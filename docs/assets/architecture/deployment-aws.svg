<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" role="img" aria-labelledby="deployment-aws-title deployment-aws-desc" font-family="Arial, Helvetica, sans-serif"><title id="deployment-aws-title">AWS | Private application, two-zone recovery</title><desc id="deployment-aws-desc">An internet-facing ALB reaches private EC2 instances across two zones. Both use the RDS writer endpoint; the Multi-AZ DB instance standby is not a read target. This is one region, not regional disaster recovery.</desc><defs><marker id="deployment-aws-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34465a"/></marker></defs><rect width="960" height="1080" fill="#fff"/><text x="24" y="34" font-size="23" fill="#34465a" font-weight="700"><tspan x="24" dy="0">AWS | Private application, two-zone recovery</tspan></text><text x="24" y="61" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="1038" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="1059" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="320" y="90" width="320" height="64" rx="8" fill="#ffffff" stroke="#34465a" stroke-width="1.5"/><text x="334" y="114" font-size="15" fill="#34465a" font-weight="700"><tspan x="334" dy="0">Clients</tspan></text><text x="334" y="137" font-size="14" fill="#34465a" font-weight="400"><tspan x="334" dy="0">DNS resolves the ALB name</tspan></text><rect x="24" y="218" width="912" height="710" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="242" font-size="15" fill="#9a5307" font-weight="700"><tspan x="38" dy="0">AWS account | selected region</tspan></text><rect x="44" y="262" width="872" height="636" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="58" y="286" font-size="15" fill="#9a5307" font-weight="700"><tspan x="58" dy="0">VPC | regional network</tspan></text><rect x="250" y="316" width="460" height="90" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="264" y="340" font-size="15" fill="#9a5307" font-weight="700"><tspan x="264" dy="0">Application Load Balancer</tspan></text><text x="264" y="363" font-size="14" fill="#34465a" font-weight="400"><tspan x="264" dy="0">Public subnets in AZ A and AZ B; AWS WAF</tspan></text><path d="M480,154 L480,316" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-aws-arrow)"/><rect x="426.2" y="223.0" width="107.60000000000001" height="21" fill="#fff"/><text x="480.0" y="238.0" text-anchor="middle" font-size="13" fill="#34465a">1  HTTPS :443</text><rect x="66" y="466" width="388" height="396" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="80" y="490" font-size="15" fill="#9a5307" font-weight="700"><tspan x="80" dy="0">VPC resources in AZ A</tspan></text><rect x="84" y="515" width="352" height="92" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="98" y="539" font-size="15" fill="#9a5307" font-weight="700"><tspan x="98" dy="0">EC2 application instances</tspan></text><text x="98" y="562" font-size="14" fill="#34465a" font-weight="400"><tspan x="98" dy="0">Private app subnet; no public IPs</tspan></text><rect x="84" y="716" width="352" height="108" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="98" y="740" font-size="15" fill="#9a5307" font-weight="700"><tspan x="98" dy="0">RDS primary</tspan></text><text x="98" y="763" font-size="14" fill="#34465a" font-weight="400"><tspan x="98" dy="0">Private DB subnet; writer</tspan></text><rect x="506" y="466" width="388" height="396" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="520" y="490" font-size="15" fill="#9a5307" font-weight="700"><tspan x="520" dy="0">VPC resources in AZ B</tspan></text><rect x="524" y="515" width="352" height="92" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="538" y="539" font-size="15" fill="#9a5307" font-weight="700"><tspan x="538" dy="0">EC2 application instances</tspan></text><text x="538" y="562" font-size="14" fill="#34465a" font-weight="400"><tspan x="538" dy="0">Private app subnet; no public IPs</tspan></text><rect x="524" y="716" width="352" height="108" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="538" y="740" font-size="15" fill="#9a5307" font-weight="700"><tspan x="538" dy="0">RDS standby</tspan></text><text x="538" y="763" font-size="14" fill="#34465a" font-weight="400"><tspan x="538" dy="0">Private DB subnet; not readable</tspan></text><path d="M360,406 L260,515" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-aws-arrow)"/><rect x="274.2" y="448.5" width="71.6" height="21" fill="#fff"/><text x="310.0" y="463.5" text-anchor="middle" font-size="13" fill="#34465a">2  HTTPS</text><path d="M600,406 L820,515" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-aws-arrow)"/><rect x="674.2" y="448.5" width="71.6" height="21" fill="#fff"/><text x="710.0" y="463.5" text-anchor="middle" font-size="13" fill="#34465a">2  HTTPS</text><path d="M260,607 L260,716" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-aws-arrow)"/><rect x="181.0" y="649.5" width="158.0" height="21" fill="#fff"/><text x="260.0" y="664.5" text-anchor="middle" font-size="13" fill="#34465a">3  SQL/TLS to writer</text><path d="M700,607 L436,742" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-aws-arrow)"/><rect x="510.6" y="662.5" width="114.8" height="21" fill="#fff"/><text x="568.0" y="677.5" text-anchor="middle" font-size="13" fill="#34465a">3  same writer</text><path d="M436,790 L524,790" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-aws-arrow)"/><rect x="458.6" y="778.0" width="42.8" height="21" fill="#fff"/><text x="480.0" y="793.0" text-anchor="middle" font-size="13" fill="#34465a">sync</text><text x="44" y="960" font-size="14" fill="#34465a" font-weight="400"><tspan x="44" dy="0">ACCESS  App security group accepts only ALB traffic; DB accepts only the app group.</tspan></text><text x="44" y="987" font-size="14" fill="#34465a" font-weight="400"><tspan x="44" dy="0">OPERATE  One ASG spans both zones • spare capacity • alarms • patching • restore tests</tspan></text></svg>
