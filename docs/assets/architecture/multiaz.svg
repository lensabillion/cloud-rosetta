<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="multiaz-title multiaz-desc" font-family="Arial, Helvetica, sans-serif"><title id="multiaz-title">RDS: availability and readable replicas</title><desc id="multiaz-desc">A Multi-AZ DB instance has a synchronous unreadable standby. A Multi-AZ DB cluster has semisynchronous replication to two readable standbys in three zones. An ordinary read replica uses asynchronous replication and is not automatic failover for its source.</desc><defs><marker id="multiaz-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34465a"/></marker></defs><rect width="960" height="650" fill="#fff"/><text x="24" y="34" font-size="23" fill="#34465a" font-weight="700"><tspan x="24" dy="0">RDS: availability and readable replicas</tspan></text><text x="24" y="61" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="608" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="629" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="24" y="94" width="288" height="454" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="118" font-size="15" fill="#9a5307" font-weight="700"><tspan x="38" dy="0">DB instance</tspan></text><rect x="40" y="146" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="54" y="170" font-size="15" fill="#9a5307" font-weight="700"><tspan x="54" dy="0">Primary | AZ A</tspan></text><path d="M168,206 L168,277" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#multiaz-arrow)"/><rect x="121.4" y="229.5" width="93.2" height="21" fill="#fff"/><text x="168.0" y="244.5" text-anchor="middle" font-size="13" fill="#34465a">Synchronous</text><rect x="40" y="277" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="54" y="301" font-size="15" fill="#9a5307" font-weight="700"><tspan x="54" dy="0">Standby | AZ B</tspan></text><text x="40" y="489" font-size="14" fill="#34465a" font-weight="400"><tspan x="40" dy="0">Standby does not serve reads</tspan></text><rect x="336" y="94" width="288" height="454" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="350" y="118" font-size="15" fill="#9a5307" font-weight="700"><tspan x="350" dy="0">DB cluster</tspan></text><rect x="352" y="146" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="366" y="170" font-size="15" fill="#9a5307" font-weight="700"><tspan x="366" dy="0">Writer | AZ A</tspan></text><path d="M480,206 L480,277" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#multiaz-arrow)"/><rect x="419.0" y="229.5" width="122.0" height="21" fill="#fff"/><text x="480.0" y="244.5" text-anchor="middle" font-size="13" fill="#34465a">Semisynchronous</text><rect x="352" y="277" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="366" y="301" font-size="15" fill="#9a5307" font-weight="700"><tspan x="366" dy="0">Reader | AZ B</tspan></text><rect x="352" y="394" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="366" y="418" font-size="15" fill="#9a5307" font-weight="700"><tspan x="366" dy="0">Reader | AZ C</tspan></text><path d="M606,176 L616,176 L616,424 L608,424" fill="none" stroke="#34465a" marker-end="url(#multiaz-arrow)"/><text x="352" y="489" font-size="14" fill="#34465a" font-weight="400"><tspan x="352" dy="0">Also reader in AZ C; both</tspan><tspan x="352" dy="21">readable</tspan></text><rect x="648" y="94" width="288" height="454" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="662" y="118" font-size="15" fill="#9a5307" font-weight="700"><tspan x="662" dy="0">Ordinary read replica</tspan></text><rect x="664" y="146" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="678" y="170" font-size="15" fill="#9a5307" font-weight="700"><tspan x="678" dy="0">Source database</tspan></text><path d="M792,206 L792,277" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#multiaz-arrow)"/><rect x="741.8" y="229.5" width="100.4" height="21" fill="#fff"/><text x="792.0" y="244.5" text-anchor="middle" font-size="13" fill="#34465a">Asynchronous</text><rect x="664" y="277" width="256" height="60" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="678" y="301" font-size="15" fill="#9a5307" font-weight="700"><tspan x="678" dy="0">Read replica</tspan></text><text x="664" y="489" font-size="14" fill="#34465a" font-weight="400"><tspan x="664" dy="0">No automatic source failover</tspan></text></svg>
