<title>Cloud Rosetta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Roboto:wght@500;700&family=Roboto+Mono:wght@400..500&family=Roboto+Serif:opsz,wght@8..144,400..800&display=swap">
<style>
/* Cloud Rosetta. Built to docs/design-system.md.
   Five rendered type sizes, 640px prose column, 280px sidebar always visible,
   56px between sections. Severity is one marker and a rule, never a fill. */
:root{
  --paper:#FBFBF9; --sheet:#FFFFFF; --sunk:#F3F5F2; --stone:#16211F;
  --ink:#121917; --ink2:#55635F; --ink3:#8A9591;
  --rule:#E4E8E4; --rule2:#CFD6D1;
  --aws:#9A5307; --azure:#12537F; --gcp:#14603C;
  --fault:#9C4A08; --void:#8A2E28; --calm:#6C7A76;
  --accent:#1F6F52; --accent-ink:#FFFFFF;
  --focus:#2E8FE0;
  --serif:"Roboto Serif",Georgia,"Times New Roman",serif;
  --sans:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --text:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-title:34px; --t-section:23px; --t-body:16px; --t-nav:14px; --t-label:13px;
  /* Nothing renders outside these five. 11px and 12px are not available. */
  --prose:620px; --wide:880px; --side:280px; --gap-section:56px; --gap-para:24px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1413; --sheet:#101A18; --sunk:#131F1C; --stone:#0A1211;
    --ink:#E9F0ED; --ink2:#9FB0AB; --ink3:#7A8985;
    --rule:#20302D; --rule2:#2D423D;
    --aws:#E2A461; --azure:#79B9E8; --gcp:#6FC69A;
    --fault:#E7A45C; --void:#E9948A; --calm:#9FB0AB;
    --accent:#59BC90; --accent-ink:#08211A;
    --focus:#6BB6F0;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1413; --sheet:#101A18; --sunk:#131F1C; --stone:#0A1211;
  --ink:#E9F0ED; --ink2:#9FB0AB; --ink3:#7A8985;
  --rule:#20302D; --rule2:#2D423D;
  --aws:#E2A461; --azure:#79B9E8; --gcp:#6FC69A;
  --fault:#E7A45C; --void:#E9948A; --calm:#9FB0AB;
  --accent:#59BC90; --accent-ink:#08211A;
  --focus:#6BB6F0;
}

*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit; font-size:var(--t-nav)}
body{background:var(--paper); color:var(--ink); font-family:var(--text);
  font-size:var(--t-body); line-height:1.65; -webkit-font-smoothing:antialiased;
  font-optical-sizing:auto}
a{color:inherit; text-decoration:underline; text-decoration-color:var(--rule2);
  text-underline-offset:2px; text-decoration-thickness:1px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px; border-radius:2px}
h1,h2,h3,h4{font-family:var(--serif); margin:0; text-wrap:balance; font-optical-sizing:auto}
p{margin:0; text-wrap:pretty}
code{font-family:var(--mono); font-size:var(--t-nav); background:var(--sunk); padding:1px 5px; border-radius:3px}

/* ---------- frame ---------- */
.app{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100vh}

.side{
  border-right:1px solid var(--rule); background:var(--sheet);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:22px 0 40px;
}
.brand{display:flex; flex-direction:column; gap:2px; padding:0 24px 20px; margin-bottom:6px; border-bottom:1px solid var(--rule)}
.brand a{text-decoration:none}
.brand b{font-family:var(--serif); font-size:var(--t-body); font-weight:800; letter-spacing:-.02em}
.brand span{font-size:var(--t-label); color:var(--ink3)}
.side nav{padding:16px 14px 0}
.grp{margin-bottom:22px}
.grp > h2{
  font-family:var(--sans); font-size:var(--t-label); font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink3); padding:0 10px; margin-bottom:6px; line-height:1.4;
}
.side a.nl{
  display:block; font-size:var(--t-nav); line-height:1.4; color:var(--ink2);
  padding:6px 10px; border-radius:5px; text-decoration:none;
}
.side a.nl:hover{background:var(--sunk); color:var(--ink)}
.side a.nl[aria-current="page"]{background:var(--sunk); color:var(--ink); font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
.side .sub{margin-left:10px; padding-left:10px; border-left:1px solid var(--rule)}
.side .sub a.nl{font-size:var(--t-label)}

/* ---------- document ---------- */
.doc{padding:0 32px 96px; min-width:0}
.page{max-width:var(--prose); margin:0 auto; padding-top:52px}
.page.wide{max-width:var(--wide)}
.page > * + *{margin-top:var(--gap-para)}
.page h1{font-size:var(--t-title); font-weight:800; line-height:1.2; letter-spacing:-.025em}
.page h2{font-size:var(--t-section); font-weight:700; line-height:1.3; letter-spacing:-.015em; margin-top:var(--gap-section)}
.page h3{font-size:var(--t-body); font-family:var(--text); font-weight:700; margin-top:32px; letter-spacing:0}
.page > h1 + p{font-size:var(--t-body); color:var(--ink2)}
.page ul,.page ol{margin:0; padding-left:22px}
.page li + li{margin-top:8px}
.page blockquote{border-left:2px solid var(--rule2); padding-left:16px; color:var(--ink2); font-style:italic}
.page hr{border:0; border-top:1px solid var(--rule); margin:var(--gap-section) 0}
.eyebrow{font-family:var(--sans); font-size:var(--t-label); font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink3); line-height:1.4}

.tw{overflow-x:auto; margin-inline:calc((var(--prose) - min(var(--wide), 100%)) / 2)}
table{border-collapse:collapse; width:100%; font-size:var(--t-label); line-height:1.5}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:top}
th{font-family:var(--sans); font-weight:700; font-size:var(--t-label); letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink3); border-bottom-color:var(--rule2); white-space:nowrap}
pre{background:var(--sunk); border:1px solid var(--rule); border-radius:6px; padding:14px 16px;
  overflow-x:auto; font-size:var(--t-label); line-height:1.6}
pre code{background:none; padding:0; font-size:inherit}

/* ---------- entry ---------- */
.hero{max-width:var(--prose); margin:0 auto; padding:96px 0 0; display:flex; flex-direction:column; gap:26px}
.hero h1{font-size:var(--t-title); font-weight:800; line-height:1.05; letter-spacing:-.035em}
.hero .lede{font-size:var(--t-body); line-height:1.55; color:var(--ink2)}
.hero .lede b{color:var(--ink); font-weight:600}
.cta{
  align-self:flex-start; display:inline-flex; align-items:center; gap:9px;
  background:var(--accent); color:var(--accent-ink); text-decoration:none;
  font-family:var(--sans); font-weight:700; font-size:var(--t-nav); letter-spacing:.02em;
  padding:13px 24px; border-radius:6px;
}
.cta:hover{filter:brightness(1.06)}
.hero .after{font-size:var(--t-label); color:var(--ink3)}

/* ---------- reference rows: calm, no fills ---------- */
.row{border-top:1px solid var(--rule); padding:26px 0 22px}
.row:first-of-type{border-top:1px solid var(--rule2)}
.rhead{display:flex; gap:14px; align-items:baseline; justify-content:space-between; flex-wrap:wrap; margin-bottom:14px}
.rhead h3{font-family:var(--serif); font-size:var(--t-body); font-weight:700; margin:0; letter-spacing:-.012em; line-height:1.3}
.marks{display:inline-flex; gap:12px; align-items:baseline; white-space:nowrap}
.mk{font-family:var(--sans); font-size:var(--t-label); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--calm)}
.mk.b-serious,.mk.d-none{color:var(--void)}
.mk.b-regular,.mk.d-partial{color:var(--fault)}
.svcs{display:flex; flex-direction:column; gap:0}
.svc{display:grid; grid-template-columns:104px minmax(0,1fr); gap:14px; padding:7px 0; border-top:1px dotted var(--rule)}
.svc:first-child{border-top:0}
.svc .who{font-family:var(--sans); font-size:var(--t-label); font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding-top:3px}
.svc.aws .who{color:var(--aws)} .svc.azure .who{color:var(--azure)} .svc.gcp .who{color:var(--gcp)}
.svc .what{font-size:var(--t-body); line-height:1.45}
.svc .what em{color:var(--ink3); font-size:var(--t-label)}
.svc .meta{display:block; font-size:var(--t-label); color:var(--ink2); margin-top:3px; line-height:1.5}
.svc .was{font-family:var(--mono); font-size:var(--t-label); color:var(--ink3)}

details.note{margin-top:14px; border-left:2px solid var(--rule2); padding-left:16px}
details.note[open]{border-left-color:var(--fault)}
details.note > summary{
  cursor:pointer; list-style:none; font-family:var(--sans); font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--fault); font-size:var(--t-label);
}
details.note > summary::-webkit-details-marker{display:none}
details.note > summary::before{content:"▸ "; }
details.note[open] > summary::before{content:"▾ "; }
details.note p{margin-top:10px; font-size:var(--t-body); line-height:1.6; color:var(--ink2)}
.rfoot{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-top:14px; font-size:var(--t-label); color:var(--ink3)}
.tag{font-family:var(--mono); font-size:var(--t-label); border:1px solid var(--rule); border-radius:3px; padding:0 5px; color:var(--ink2)}
.stamp{margin-left:auto; font-family:var(--mono); font-size:var(--t-label); white-space:nowrap}

/* ---------- decoder ---------- */
.term{border-top:1px solid var(--rule); padding:30px 0 24px}
.term h3{font-family:var(--serif); font-size:var(--t-section); font-weight:800; margin:0 0 4px; letter-spacing:-.025em}
.term .sev{font-family:var(--sans); font-size:var(--t-label); font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--calm)}
.term.s-high .sev{color:var(--void)} .term.s-medium .sev{color:var(--fault)}
.senses{margin-top:16px; display:flex; flex-direction:column; gap:0}
.sense{display:grid; grid-template-columns:104px minmax(0,1fr); gap:14px; padding:11px 0; border-top:1px dotted var(--rule)}
.sense .who{font-family:var(--sans); font-size:var(--t-label); font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding-top:3px}
.sense.aws .who{color:var(--aws)} .sense.azure .who{color:var(--azure)} .sense.gcp .who{color:var(--gcp)}
.sense .cat{font-family:var(--serif); font-style:italic; font-weight:700; font-size:var(--t-body)}
.sense p{font-size:var(--t-label); color:var(--ink2); margin-top:3px; line-height:1.55}

/* ---------- search ---------- */
.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.toolbar input{
  flex:1 1 240px; min-width:0; font:inherit; font-size:var(--t-nav); color:var(--ink);
  background:var(--sheet); border:1px solid var(--rule2); border-radius:6px; padding:9px 12px;
}
.toolbar input::placeholder{color:var(--ink3)}
.toolbar button{
  font-family:var(--sans); font-size:var(--t-nav); font-weight:600; color:var(--ink2); cursor:pointer;
  background:var(--sheet); border:1px solid var(--rule2); border-radius:6px; padding:8px 13px;
}
.toolbar button[aria-pressed="true"]{background:var(--fault); border-color:var(--fault); color:#fff}
.tcount{font-family:var(--mono); font-size:var(--t-label); color:var(--ink3); margin-left:auto}
.empty{color:var(--ink3); padding:44px 0; font-size:var(--t-label)}
.hide{display:none !important}

.themetog{
  font-size:var(--t-body); position:fixed; right:18px; top:16px; z-index:40; cursor:pointer;
  background:var(--sheet); border:1px solid var(--rule2); border-radius:6px;
  width:34px; height:34px; font-size:var(--t-body); line-height:1; color:var(--ink2);
}
.menutog{display:none}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static; height:auto; border-right:0; border-bottom:1px solid var(--rule); padding-bottom:14px}
  .side nav{display:none}
  .side nav.open{display:block}
  .menutog{
    display:block; margin:14px 24px 0; cursor:pointer; font-family:var(--sans); font-weight:700;
    font-size:var(--t-label); letter-spacing:.1em; text-transform:uppercase; color:var(--ink2);
    background:var(--sunk); border:1px solid var(--rule2); border-radius:6px; padding:9px 14px;
  }
  .doc{padding:0 20px 72px}
  .hero{padding-top:44px} .hero h1{font-size:34px}
  .page h1{font-size:28px}
  .svc,.sense{grid-template-columns:1fr; gap:2px}
  .tw{margin-inline:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
