<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="role-title role-desc" font-family="Arial, Helvetica, sans-serif"><title id="role-title">Identity, credentials and permissions</title><desc id="role-desc">AWS STS issues temporary role-session credentials after successful role assumption. Azure RBAC and Google IAM assign a permission set to a principal at a scope; conditions and denies still apply.</desc><defs><marker id="role-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="960" height="550" fill="#fff"/><text x="24" y="34" font-size="23" fill="#375174" font-weight="700"><tspan x="24" dy="0">Identity, credentials and permissions</tspan></text><text x="24" y="61" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="508" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="529" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><text x="24" y="106" font-size="15" fill="#375174" font-weight="700"><tspan x="24" dy="0">AWS | role assumption and an authorized request</tspan></text><rect x="24" y="126" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="38" y="150" font-size="15" fill="#375174" font-weight="700"><tspan x="38" dy="0">Principal</tspan></text><text x="38" y="173" font-size="14" fill="#375174" font-weight="400"><tspan x="38" dy="0">User, workload or</tspan><tspan x="38" dy="21">federation</tspan></text><rect x="364" y="126" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="378" y="150" font-size="15" fill="#B45309" font-weight="700"><tspan x="378" dy="0">Role session</tspan></text><text x="378" y="173" font-size="14" fill="#375174" font-weight="400"><tspan x="378" dy="0">Temporary STS credentials</tspan></text><rect x="704" y="126" width="230" height="90" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="718" y="150" font-size="15" fill="#B45309" font-weight="700"><tspan x="718" dy="0">Target resource</tspan></text><text x="718" y="173" font-size="14" fill="#375174" font-weight="400"><tspan x="718" dy="0">Checks applicable policies</tspan></text><path d="M254,171 L364,171" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#role-arrow)"/><rect x="262.4" y="159.0" width="93.2" height="21" fill="#fff"/><text x="309.0" y="174.0" text-anchor="middle" font-size="14" fill="#375174">assume role</text><path d="M594,171 L704,171" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#role-arrow)"/><rect x="602.4" y="159.0" width="93.2" height="21" fill="#fff"/><text x="649.0" y="174.0" text-anchor="middle" font-size="14" fill="#375174">API request</text><text x="24" y="265" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Trust policy controls who may assume the role; an assumption request must be authorized.</tspan></text><text x="24" y="325" font-size="15" fill="#375174" font-weight="700"><tspan x="24" dy="0">Azure / Google | a grant relates a principal, a permission set and a scope</tspan></text><rect x="24" y="350" width="230" height="92" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="38" y="374" font-size="15" fill="#375174" font-weight="700"><tspan x="38" dy="0">Principal</tspan></text><text x="38" y="397" font-size="14" fill="#375174" font-weight="400"><tspan x="38" dy="0">Person or workload</tspan></text><rect x="364" y="350" width="230" height="92" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="378" y="374" font-size="15" fill="#375174" font-weight="700"><tspan x="378" dy="0">Role assignment / binding</tspan></text><text x="378" y="397" font-size="14" fill="#375174" font-weight="400"><tspan x="378" dy="0">Role is a permission set</tspan></text><rect x="704" y="350" width="230" height="92" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="718" y="374" font-size="15" fill="#375174" font-weight="700"><tspan x="718" dy="0">Scope</tspan></text><text x="718" y="397" font-size="14" fill="#375174" font-weight="400"><tspan x="718" dy="0">Grant can inherit to</tspan><tspan x="718" dy="21">children</tspan></text><path d="M254,396 L364,396" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#role-arrow)" stroke-dasharray="5 4"/><rect x="251.6" y="384.0" width="114.8" height="21" fill="#fff"/><text x="309.0" y="399.0" text-anchor="middle" font-size="14" fill="#375174">receives grant</text><path d="M594,396 L704,396" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#role-arrow)" stroke-dasharray="5 4"/><rect x="606.0" y="384.0" width="86.0" height="21" fill="#fff"/><text x="649.0" y="399.0" text-anchor="middle" font-size="14" fill="#375174">applies at</text></svg>
