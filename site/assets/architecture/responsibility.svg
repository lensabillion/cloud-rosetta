<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="responsibility-title responsibility-desc" font-family="Arial, Helvetica, sans-serif"><title id="responsibility-title">Managed service does not mean unmanaged responsibility</title><desc id="responsibility-desc">Customer duties remain across IaaS, PaaS and SaaS: protect data, manage access and configure available controls. Guest OS management is normally customer responsibility in IaaS and provider responsibility in managed PaaS and SaaS. Service-specific shared duties remain.</desc><defs><marker id="responsibility-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="960" height="490" fill="#fff"/><text x="24" y="34" font-size="23" fill="#375174" font-weight="700"><tspan x="24" dy="0">Managed service does not mean unmanaged responsibility</tspan></text><text x="24" y="61" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="448" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="469" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="24" y="94" width="288" height="304" rx="8" fill="#F5F7FA" stroke="#375174" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="118" font-size="15" fill="#375174" font-weight="700"><tspan x="38" dy="0">IaaS</tspan></text><rect x="40" y="148" width="256" height="100" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="54" y="172" font-size="15" fill="#375174" font-weight="700"><tspan x="54" dy="0">Customer duties remain</tspan></text><text x="54" y="195" font-size="14" fill="#375174" font-weight="400"><tspan x="54" dy="0">Data protection, identities,</tspan><tspan x="54" dy="21">access and available settings</tspan></text><rect x="40" y="279" width="256" height="88" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="54" y="303" font-size="15" fill="#375174" font-weight="700"><tspan x="54" dy="0">Service-dependent duties</tspan></text><text x="54" y="326" font-size="14" fill="#375174" font-weight="400"><tspan x="54" dy="0">Operate guest OS and</tspan><tspan x="54" dy="21">applications</tspan></text><rect x="336" y="94" width="288" height="304" rx="8" fill="#F5F7FA" stroke="#375174" stroke-width="1.5" stroke-dasharray="7 5"/><text x="350" y="118" font-size="15" fill="#375174" font-weight="700"><tspan x="350" dy="0">PaaS</tspan></text><rect x="352" y="148" width="256" height="100" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="366" y="172" font-size="15" fill="#375174" font-weight="700"><tspan x="366" dy="0">Customer duties remain</tspan></text><text x="366" y="195" font-size="14" fill="#375174" font-weight="400"><tspan x="366" dy="0">Data protection, identities,</tspan><tspan x="366" dy="21">access and available settings</tspan></text><rect x="352" y="279" width="256" height="88" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="366" y="303" font-size="15" fill="#375174" font-weight="700"><tspan x="366" dy="0">Service-dependent duties</tspan></text><text x="366" y="326" font-size="14" fill="#375174" font-weight="400"><tspan x="366" dy="0">Configure application and</tspan><tspan x="366" dy="21">platform controls</tspan></text><rect x="648" y="94" width="288" height="304" rx="8" fill="#F5F7FA" stroke="#375174" stroke-width="1.5" stroke-dasharray="7 5"/><text x="662" y="118" font-size="15" fill="#375174" font-weight="700"><tspan x="662" dy="0">SaaS</tspan></text><rect x="664" y="148" width="256" height="100" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="678" y="172" font-size="15" fill="#375174" font-weight="700"><tspan x="678" dy="0">Customer duties remain</tspan></text><text x="678" y="195" font-size="14" fill="#375174" font-weight="400"><tspan x="678" dy="0">Data protection, identities,</tspan><tspan x="678" dy="21">access and available settings</tspan></text><rect x="664" y="279" width="256" height="88" rx="8" fill="#FFFFFF" stroke="#375174" stroke-width="1.5"/><text x="678" y="303" font-size="15" fill="#375174" font-weight="700"><tspan x="678" dy="0">Service-dependent duties</tspan></text><text x="678" y="326" font-size="14" fill="#375174" font-weight="400"><tspan x="678" dy="0">Configure service settings and</tspan><tspan x="678" dy="21">access</tspan></text></svg>
