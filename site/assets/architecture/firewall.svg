<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="firewall-title firewall-desc" font-family="Arial, Helvetica, sans-serif"><title id="firewall-title">Native network filtering: specify the control</title><desc id="firewall-desc">AWS security groups are stateful allow-only while network ACLs are stateless allow/deny. Azure NSGs are stateful at subnet or NIC. Google VPC firewall rules belong to a network and target VM interfaces.</desc><defs><marker id="firewall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="960" height="570" fill="#fff"/><text x="24" y="34" font-size="23" fill="#375174" font-weight="700"><tspan x="24" dy="0">Native network filtering: specify the control</tspan></text><text x="24" y="61" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="528" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="549" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="24" y="94" width="288" height="385" rx="8" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="118" font-size="15" fill="#B45309" font-weight="700"><tspan x="38" dy="0">AWS</tspan></text><rect x="40" y="147" width="256" height="102" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="54" y="171" font-size="15" fill="#B45309" font-weight="700"><tspan x="54" dy="0">Network ACL | subnet</tspan></text><text x="54" y="194" font-size="14" fill="#375174" font-weight="400"><tspan x="54" dy="0">Stateless; allow and deny</tspan></text><rect x="40" y="304" width="256" height="112" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="54" y="328" font-size="15" fill="#B45309" font-weight="700"><tspan x="54" dy="0">Security group | interface</tspan></text><text x="54" y="351" font-size="14" fill="#375174" font-weight="400"><tspan x="54" dy="0">Stateful; allow only</tspan></text><text x="40" y="447" font-size="14" fill="#375174" font-weight="400"><tspan x="40" dy="0">See chapter for defaults and</tspan><tspan x="40" dy="21">priority.</tspan></text><rect x="336" y="94" width="288" height="385" rx="8" fill="#F5F7FA" stroke="#3776FF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="350" y="118" font-size="15" fill="#3776FF" font-weight="700"><tspan x="350" dy="0">Azure</tspan></text><rect x="352" y="147" width="256" height="102" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="366" y="171" font-size="15" fill="#3776FF" font-weight="700"><tspan x="366" dy="0">NSG | subnet</tspan></text><text x="366" y="194" font-size="14" fill="#375174" font-weight="400"><tspan x="366" dy="0">Stateful; allow and deny</tspan></text><rect x="352" y="304" width="256" height="112" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="366" y="328" font-size="15" fill="#3776FF" font-weight="700"><tspan x="366" dy="0">NSG | network interface</tspan></text><text x="366" y="351" font-size="14" fill="#375174" font-weight="400"><tspan x="366" dy="0">If both are assigned, both</tspan><tspan x="366" dy="21">apply</tspan></text><text x="352" y="447" font-size="14" fill="#375174" font-weight="400"><tspan x="352" dy="0">See chapter for defaults and</tspan><tspan x="352" dy="21">priority.</tspan></text><rect x="648" y="94" width="288" height="385" rx="8" fill="#F5F7FA" stroke="#0E8F63" stroke-width="1.5" stroke-dasharray="7 5"/><text x="662" y="118" font-size="15" fill="#0E8F63" font-weight="700"><tspan x="662" dy="0">Google Cloud</tspan></text><rect x="664" y="147" width="256" height="102" rx="8" fill="#FFFFFF" stroke="#0E8F63" stroke-width="1.5"/><text x="678" y="171" font-size="15" fill="#0E8F63" font-weight="700"><tspan x="678" dy="0">VPC firewall rule</tspan></text><text x="678" y="194" font-size="14" fill="#375174" font-weight="400"><tspan x="678" dy="0">Defined on the VPC network</tspan></text><rect x="664" y="304" width="256" height="112" rx="8" fill="#FFFFFF" stroke="#0E8F63" stroke-width="1.5"/><text x="678" y="328" font-size="15" fill="#0E8F63" font-weight="700"><tspan x="678" dy="0">VM interface targets</tspan></text><text x="678" y="351" font-size="14" fill="#375174" font-weight="400"><tspan x="678" dy="0">All instances, tags or service</tspan><tspan x="678" dy="21">accounts</tspan></text><text x="664" y="447" font-size="14" fill="#375174" font-weight="400"><tspan x="664" dy="0">See chapter for defaults and</tspan><tspan x="664" dy="21">priority.</tspan></text></svg>
