<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="database-failover-title database-failover-desc" font-family="Arial, Helvetica, sans-serif"><title id="database-failover-title">RDS DB instance: before and after a zone outage</title><desc id="database-failover-desc">Before failure the database endpoint directs clients to the primary in zone A, with synchronous replication to a non-readable standby in zone B. After RDS promotes the standby, clients reconnect using the endpoint; existing sessions are interrupted.</desc><defs><marker id="database-failover-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34465a"/></marker></defs><rect width="960" height="560" fill="#fff"/><text x="24" y="34" font-size="23" fill="#34465a" font-weight="700"><tspan x="24" dy="0">RDS DB instance: before and after a zone outage</tspan></text><text x="24" y="61" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="518" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="539" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="24" y="94" width="432" height="368" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="118" font-size="15" fill="#9a5307" font-weight="700"><tspan x="38" dy="0">BEFORE outage</tspan></text><rect x="128" y="140" width="224" height="70" rx="8" fill="#ffffff" stroke="#34465a" stroke-width="1.5"/><text x="142" y="164" font-size="15" fill="#34465a" font-weight="700"><tspan x="142" dy="0">Application</tspan></text><text x="142" y="187" font-size="14" fill="#34465a" font-weight="400"><tspan x="142" dy="0">Uses DB endpoint; retries</tspan><tspan x="142" dy="21">safely</tspan></text><rect x="38" y="323" width="194" height="90" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="52" y="347" font-size="15" fill="#9a5307" font-weight="700"><tspan x="52" dy="0">AZ A</tspan></text><text x="52" y="370" font-size="14" fill="#34465a" font-weight="400"><tspan x="52" dy="0">Primary: reads /</tspan><tspan x="52" dy="21">writes</tspan></text><rect x="248" y="323" width="194" height="90" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="262" y="347" font-size="15" fill="#9a5307" font-weight="700"><tspan x="262" dy="0">AZ B</tspan></text><text x="262" y="370" font-size="14" fill="#34465a" font-weight="400"><tspan x="262" dy="0">Standby: no client</tspan><tspan x="262" dy="21">reads</tspan></text><path d="M240,210 L135,323" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#database-failover-arrow)"/><rect x="140.9" y="254.5" width="93.2" height="21" fill="#fff"/><text x="187.5" y="269.5" text-anchor="middle" font-size="13" fill="#34465a">SQL session</text><path d="M232,369 L248,369" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#database-failover-arrow)"/><rect x="218.6" y="357.0" width="42.8" height="21" fill="#fff"/><text x="240.0" y="372.0" text-anchor="middle" font-size="13" fill="#34465a">sync</text><rect x="504" y="94" width="432" height="368" rx="8" fill="#f5f8fb" stroke="#9a5307" stroke-width="1.5" stroke-dasharray="7 5"/><text x="518" y="118" font-size="15" fill="#9a5307" font-weight="700"><tspan x="518" dy="0">AFTER failover</tspan></text><rect x="608" y="140" width="224" height="70" rx="8" fill="#ffffff" stroke="#34465a" stroke-width="1.5"/><text x="622" y="164" font-size="15" fill="#34465a" font-weight="700"><tspan x="622" dy="0">Application</tspan></text><text x="622" y="187" font-size="14" fill="#34465a" font-weight="400"><tspan x="622" dy="0">Uses DB endpoint; retries</tspan><tspan x="622" dy="21">safely</tspan></text><rect x="518" y="323" width="194" height="90" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="532" y="347" font-size="15" fill="#9a5307" font-weight="700"><tspan x="532" dy="0">AZ A</tspan></text><text x="532" y="370" font-size="14" fill="#34465a" font-weight="400"><tspan x="532" dy="0">Unavailable</tspan></text><rect x="728" y="323" width="194" height="90" rx="8" fill="#ffffff" stroke="#9a5307" stroke-width="1.5"/><text x="742" y="347" font-size="15" fill="#9a5307" font-weight="700"><tspan x="742" dy="0">AZ B</tspan></text><text x="742" y="370" font-size="14" fill="#34465a" font-weight="400"><tspan x="742" dy="0">Promoted: reads /</tspan><tspan x="742" dy="21">writes</tspan></text><path d="M720,210 L825,323" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#database-failover-arrow)" stroke-dasharray="5 4"/><rect x="733.1" y="254.5" width="78.8" height="21" fill="#fff"/><text x="772.5" y="269.5" text-anchor="middle" font-size="13" fill="#34465a">reconnect</text></svg>
