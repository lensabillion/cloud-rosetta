<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="scope-title scope-desc" font-family="Arial, Helvetica, sans-serif"><title id="scope-title">Network membership and location are separate</title><desc id="scope-desc">Each subnet belongs to its virtual network. AWS subnets occupy one zone; Azure and Google subnets are regional. A network does not own geographic zones.</desc><defs><marker id="scope-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="960" height="490" fill="#fff"/><text x="24" y="34" font-size="23" fill="#375174" font-weight="700"><tspan x="24" dy="0">Network membership and location are separate</tspan></text><text x="24" y="61" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="448" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="469" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="24" y="90" width="288" height="314" rx="8" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="114" font-size="15" fill="#B45309" font-weight="700"><tspan x="38" dy="0">AWS</tspan></text><rect x="40" y="138" width="256" height="82" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="54" y="162" font-size="15" fill="#B45309" font-weight="700"><tspan x="54" dy="0">VPC</tspan></text><text x="54" y="185" font-size="14" fill="#375174" font-weight="400"><tspan x="54" dy="0">Location: Regional</tspan></text><path d="M168,220 L168,274" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#scope-arrow)"/><rect x="107.0" y="235.0" width="122.0" height="21" fill="#fff"/><text x="168.0" y="250.0" text-anchor="middle" font-size="14" fill="#375174">contains subnet</text><rect x="40" y="274" width="256" height="104" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="54" y="298" font-size="15" fill="#B45309" font-weight="700"><tspan x="54" dy="0">Subnet</tspan></text><text x="54" y="321" font-size="14" fill="#375174" font-weight="400"><tspan x="54" dy="0">Location: One Availability</tspan><tspan x="54" dy="21">Zone</tspan></text><rect x="336" y="90" width="288" height="314" rx="8" fill="#F5F7FA" stroke="#3776FF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="350" y="114" font-size="15" fill="#3776FF" font-weight="700"><tspan x="350" dy="0">Azure</tspan></text><rect x="352" y="138" width="256" height="82" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="366" y="162" font-size="15" fill="#3776FF" font-weight="700"><tspan x="366" dy="0">Virtual network</tspan></text><text x="366" y="185" font-size="14" fill="#375174" font-weight="400"><tspan x="366" dy="0">Location: Regional</tspan></text><path d="M480,220 L480,274" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#scope-arrow)"/><rect x="419.0" y="235.0" width="122.0" height="21" fill="#fff"/><text x="480.0" y="250.0" text-anchor="middle" font-size="14" fill="#375174">contains subnet</text><rect x="352" y="274" width="256" height="104" rx="8" fill="#FFFFFF" stroke="#3776FF" stroke-width="1.5"/><text x="366" y="298" font-size="15" fill="#3776FF" font-weight="700"><tspan x="366" dy="0">Subnet</tspan></text><text x="366" y="321" font-size="14" fill="#375174" font-weight="400"><tspan x="366" dy="0">Location: Regional; not</tspan><tspan x="366" dy="21">zone-bound</tspan></text><rect x="648" y="90" width="288" height="314" rx="8" fill="#F5F7FA" stroke="#0E8F63" stroke-width="1.5" stroke-dasharray="7 5"/><text x="662" y="114" font-size="15" fill="#0E8F63" font-weight="700"><tspan x="662" dy="0">Google Cloud</tspan></text><rect x="664" y="138" width="256" height="82" rx="8" fill="#FFFFFF" stroke="#0E8F63" stroke-width="1.5"/><text x="678" y="162" font-size="15" fill="#0E8F63" font-weight="700"><tspan x="678" dy="0">VPC network</tspan></text><text x="678" y="185" font-size="14" fill="#375174" font-weight="400"><tspan x="678" dy="0">Location: Global</tspan></text><path d="M792,220 L792,274" fill="none" stroke="#375174" stroke-width="1.8" marker-end="url(#scope-arrow)"/><rect x="731.0" y="235.0" width="122.0" height="21" fill="#fff"/><text x="792.0" y="250.0" text-anchor="middle" font-size="14" fill="#375174">contains subnet</text><rect x="664" y="274" width="256" height="104" rx="8" fill="#FFFFFF" stroke="#0E8F63" stroke-width="1.5"/><text x="678" y="298" font-size="15" fill="#0E8F63" font-weight="700"><tspan x="678" dy="0">Subnet</tspan></text><text x="678" y="321" font-size="14" fill="#375174" font-weight="400"><tspan x="678" dy="0">Location: One region</tspan></text></svg>
