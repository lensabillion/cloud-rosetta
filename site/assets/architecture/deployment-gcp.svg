<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" role="img" aria-labelledby="deployment-gcp-title deployment-gcp-desc" font-family="Arial, Helvetica, sans-serif"><title id="deployment-gcp-title">Google Cloud | Global ingress, regional application</title><desc id="deployment-gcp-desc">A global external Application Load Balancer uses a regional managed instance group. The VPC is global, its subnet is regional and VMs occupy zones. Cloud SQL HA uses private services access outside the consumer VPC. Global ingress does not provide regional recovery.</desc><defs><marker id="deployment-gcp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34465a"/></marker></defs><rect width="960" height="1120" fill="#fff"/><text x="24" y="34" font-size="23" fill="#34465a" font-weight="700"><tspan x="24" dy="0">Google Cloud | Global ingress, regional application</tspan></text><text x="24" y="61" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="1078" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="1099" font-size="13" fill="#34465a" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="300" y="90" width="360" height="64" rx="8" fill="#ffffff" stroke="#34465a" stroke-width="1.5"/><text x="314" y="114" font-size="15" fill="#34465a" font-weight="700"><tspan x="314" dy="0">Clients</tspan></text><text x="314" y="137" font-size="14" fill="#34465a" font-weight="400"><tspan x="314" dy="0">DNS resolves the load balancer IP</tspan></text><rect x="24" y="190" width="912" height="808" rx="8" fill="#f5f8fb" stroke="#14603c" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="214" font-size="15" fill="#14603c" font-weight="700"><tspan x="38" dy="0">Workload project</tspan></text><rect x="220" y="220" width="520" height="90" rx="8" fill="#ffffff" stroke="#14603c" stroke-width="1.5"/><text x="234" y="244" font-size="15" fill="#14603c" font-weight="700"><tspan x="234" dy="0">Global external Application Load Balancer</tspan></text><text x="234" y="267" font-size="14" fill="#34465a" font-weight="400"><tspan x="234" dy="0">Cloud Armor policy; HTTPS frontend and backend</tspan></text><path d="M480,154 L480,220" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-gcp-arrow)"/><rect x="426.2" y="175.0" width="107.60000000000001" height="21" fill="#fff"/><text x="480.0" y="190.0" text-anchor="middle" font-size="13" fill="#34465a">1  HTTPS :443</text><rect x="44" y="418" width="534" height="542" rx="8" fill="#f5f8fb" stroke="#14603c" stroke-width="1.5" stroke-dasharray="7 5"/><text x="58" y="442" font-size="15" fill="#14603c" font-weight="700"><tspan x="58" dy="0">VPC network | global</tspan></text><rect x="64" y="468" width="494" height="320" rx="8" fill="#f5f8fb" stroke="#14603c" stroke-width="1.5" stroke-dasharray="7 5"/><text x="78" y="492" font-size="15" fill="#14603c" font-weight="700"><tspan x="78" dy="0">Regional subnet</tspan></text><rect x="84" y="520" width="212" height="152" rx="8" fill="#f5f8fb" stroke="#14603c" stroke-width="1.5" stroke-dasharray="7 5"/><text x="98" y="544" font-size="15" fill="#14603c" font-weight="700"><tspan x="98" dy="0">Zone A</tspan></text><rect x="96" y="562" width="188" height="86" rx="8" fill="#ffffff" stroke="#14603c" stroke-width="1.5"/><text x="110" y="586" font-size="15" fill="#14603c" font-weight="700"><tspan x="110" dy="0">Compute Engine</tspan></text><text x="110" y="609" font-size="14" fill="#34465a" font-weight="400"><tspan x="110" dy="0">Private app VMs</tspan></text><rect x="326" y="520" width="212" height="152" rx="8" fill="#f5f8fb" stroke="#14603c" stroke-width="1.5" stroke-dasharray="7 5"/><text x="340" y="544" font-size="15" fill="#14603c" font-weight="700"><tspan x="340" dy="0">Zone B</tspan></text><rect x="338" y="562" width="188" height="86" rx="8" fill="#ffffff" stroke="#14603c" stroke-width="1.5"/><text x="352" y="586" font-size="15" fill="#14603c" font-weight="700"><tspan x="352" dy="0">Compute Engine</tspan></text><text x="352" y="609" font-size="14" fill="#34465a" font-weight="400"><tspan x="352" dy="0">Private app VMs</tspan></text><path d="M380,310 L190,562" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-gcp-arrow)"/><rect x="206.0" y="424.0" width="158.0" height="21" fill="#fff"/><text x="285.0" y="439.0" text-anchor="middle" font-size="13" fill="#34465a">2  HTTPS to backends</text><path d="M580,310 L432,562" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-gcp-arrow)"/><rect x="427.0" y="424.0" width="158.0" height="21" fill="#fff"/><text x="506.0" y="439.0" text-anchor="middle" font-size="13" fill="#34465a">2  HTTPS to backends</text><text x="88" y="713" font-size="14" fill="#34465a" font-weight="700"><tspan x="88" dy="0">Regional MIG spans selected zones.</tspan></text><text x="88" y="741" font-size="14" fill="#34465a" font-weight="400"><tspan x="88" dy="0">Health checks + spare serving capacity.</tspan></text><rect x="86" y="850" width="450" height="80" rx="8" fill="#ffffff" stroke="#14603c" stroke-width="1.5"/><text x="100" y="874" font-size="15" fill="#14603c" font-weight="700"><tspan x="100" dy="0">Private services access</tspan></text><text x="100" y="897" font-size="14" fill="#34465a" font-weight="400"><tspan x="100" dy="0">Allocated address range + private connection</tspan></text><path d="M310,788 L310,850" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-gcp-arrow)"/><rect x="267.0" y="807.0" width="86.0" height="21" fill="#fff"/><text x="310.0" y="822.0" text-anchor="middle" font-size="13" fill="#34465a">3  SQL/TLS</text><rect x="684" y="796" width="228" height="164" rx="8" fill="#ffffff" stroke="#14603c" stroke-width="1.5"/><text x="698" y="820" font-size="15" fill="#14603c" font-weight="700"><tspan x="698" dy="0">Cloud SQL HA</tspan></text><text x="698" y="843" font-size="14" fill="#34465a" font-weight="400"><tspan x="698" dy="0">Same region; primary +</tspan><tspan x="698" dy="21">standby zones; public IP</tspan><tspan x="698" dy="21">disabled</tspan></text><path d="M536,890 L684,890" fill="none" stroke="#34465a" stroke-width="1.8" marker-end="url(#deployment-gcp-arrow)"/><rect x="556.2" y="878.0" width="107.60000000000001" height="21" fill="#fff"/><text x="610.0" y="893.0" text-anchor="middle" font-size="13" fill="#34465a">4  private IP</text><text x="44" y="1030" font-size="14" fill="#34465a" font-weight="400"><tspan x="44" dy="0">ACCESS  Firewall permits required proxies and health checks; app identity and DB auth are separate.</tspan></text><text x="44" y="1057" font-size="14" fill="#34465a" font-weight="400"><tspan x="44" dy="0">OPERATE  Cloud Monitoring • autohealing policy • backups + PITR • reconnect after failover</tspan></text></svg>
