<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="identity-decision-title identity-decision-desc" font-family="Arial, Helvetica, sans-serif"><title id="identity-decision-title">Two bounded AWS permission decisions</title><desc id="identity-decision-desc">Example A: identity allows PutObject but boundary allows only GetObject, so deny. Example B: same-account bucket policy directly grants an IAM user GetObject, so omission from identity policy and boundary alone does not block it. No other restrictions are assumed.</desc><defs><marker id="identity-decision-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#375174"/></marker></defs><rect width="960" height="470" fill="#fff"/><text x="24" y="34" font-size="23" fill="#375174" font-weight="700"><tspan x="24" dy="0">Two bounded AWS permission decisions</tspan></text><text x="24" y="61" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Cloud Rosetta | Conceptual architecture | Sources and assumptions in the chapter</tspan></text><text x="24" y="428" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">Legend: dashed box = labelled scope; solid arrow = named relationship;</tspan></text><text x="24" y="449" font-size="14" fill="#375174" font-weight="400"><tspan x="24" dy="0">dashed arrow = control or recovery action. Colors identify providers, not security.</tspan></text><rect x="24" y="94" width="432" height="276" rx="8" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="38" y="118" font-size="15" fill="#B45309" font-weight="700"><tspan x="38" dy="0">A | Identity-based grant</tspan></text><text x="42" y="155" font-size="15" fill="#375174" font-weight="700"><tspan x="42" dy="0">User policy allows PutObject</tspan></text><text x="42" y="195" font-size="15" fill="#375174" font-weight="400"><tspan x="42" dy="0">Boundary permits only GetObject</tspan></text><text x="42" y="266" font-size="15" fill="#375174" font-weight="700"><tspan x="42" dy="0">DENIED</tspan></text><text x="42" y="311" font-size="14" fill="#375174" font-weight="400"><tspan x="42" dy="0">No applicable explicit deny or other restricting</tspan><tspan x="42" dy="21">control.</tspan></text><rect x="504" y="94" width="432" height="276" rx="8" fill="#F5F7FA" stroke="#B45309" stroke-width="1.5" stroke-dasharray="7 5"/><text x="518" y="118" font-size="15" fill="#B45309" font-weight="700"><tspan x="518" dy="0">B | Direct resource grant</tspan></text><text x="522" y="155" font-size="15" fill="#375174" font-weight="700"><tspan x="522" dy="0">Bucket grants user ARN GetObject</tspan></text><text x="522" y="195" font-size="15" fill="#375174" font-weight="400"><tspan x="522" dy="0">Identity and boundary omit it</tspan></text><text x="522" y="266" font-size="15" fill="#375174" font-weight="700"><tspan x="522" dy="0">ALLOWED under stated assumptions</tspan></text><text x="522" y="311" font-size="14" fill="#375174" font-weight="400"><tspan x="522" dy="0">No applicable explicit deny or other restricting</tspan><tspan x="522" dy="21">control.</tspan></text></svg>
