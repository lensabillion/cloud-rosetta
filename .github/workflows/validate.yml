name: Validate data

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so staleness surfaces without anyone pushing.
    - cron: '0 6 * * 1'

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Check house YAML style
        run: python scripts/fmt.py --check

      - name: Validate dataset
        run: python scripts/validate.py

      - name: Check the design system
        run: python scripts/check_design.py

      - name: Test generation and its failure cases
        run: python -m unittest discover -s tests -v

      - name: Check every generated output without rewriting it
        run: python scripts/check_generated.py

  links:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check vendor links still resolve
        run: |
          # data/schema holds JSON Schema $id values, which are identifier URIs
          # rather than references to follow. Everything else must resolve.
          grep -rhoE 'https://[^ "'"'"'<>)]+' data/ --exclude-dir=schema \
            | sort -u > urls.txt
          echo "Checking $(wc -l < urls.txt) unique links"
          fail=0
          while read -r url; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            case "$code" in
              2*|3*) ;;
              *) echo "  $code  $url"; fail=1 ;;
            esac
          done < urls.txt
          exit $fail
